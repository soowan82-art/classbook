<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학급일지</title>
<meta name="theme-color" content="#1F6E8C">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* 레이아웃: 왼쪽 고정 메뉴 + 오른쪽 작업 영역. 흰 바탕에 호수색 하나만 포인트로 쓴다. */
:root{
  --bg:#F5F7F9;
  --surface:#FFFFFF;
  --ink:#18202B;
  --muted:#667085;
  --line:#E2E7EC;
  --accent:#1F6E8C;
  --accent-soft:#E7F2F6;
  --ok:#1F8A5B; --ok-soft:#E6F4EC;
  --warn:#B7700B; --warn-soft:#FBF1E1;
  --bad:#C93C3C; --bad-soft:#FBEAEA;
  --violet:#6D55C7; --violet-soft:#EFEBFA;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --font-display:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161C; --surface:#182029; --ink:#E7ECF1; --muted:#97A3B2; --line:#28323D;
    --accent:#5FB3D1; --accent-soft:#16303B;
    --ok:#4CC08A; --ok-soft:#163327; --warn:#E3A44A; --warn-soft:#3A2C14;
    --bad:#EE7777; --bad-soft:#3D1E1E; --violet:#A895F0; --violet-soft:#2A2442;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#182029; --ink:#E7ECF1; --muted:#97A3B2; --line:#28323D;
  --accent:#5FB3D1; --accent-soft:#16303B;
  --ok:#4CC08A; --ok-soft:#163327; --warn:#E3A44A; --warn-soft:#3A2C14;
  --bad:#EE7777; --bad-soft:#3D1E1E; --violet:#A895F0; --violet-soft:#2A2442;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}

.app{display:grid;grid-template-columns:224px 1fr;height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand-btn{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;font:inherit;color:inherit}
.brand-btn:hover{background:var(--hover,color-mix(in srgb,var(--accent) 5%,transparent))}
.brand-logo{width:26px;height:26px;vertical-align:-5px;margin-right:8px;border-radius:7px}
.brand-caret{font-size:12px;color:var(--muted);vertical-align:2px}
.cls-li{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font:inherit;text-align:left}
.cls-li.on{border-color:var(--accent);background:var(--accent-soft)}
.cls-li:hover{border-color:var(--accent)}
.brand .cls{font-family:var(--font-display);font-weight:700;font-size:18px}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav .grp{font-size:11.5px;color:var(--muted);padding:12px 10px 4px;letter-spacing:.04em}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{font-size:11px;color:var(--muted)}
.side-foot{padding:12px 16px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.backup-state{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.main{overflow-y:auto;height:100%}
.wrap{max-width:1240px;margin:0 auto;padding:26px 28px 60px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card > h2,.card > .spread{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .btn.pri,.btn.pri{color:var(--surface)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--bg)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:15px;line-height:1}
.x:hover{color:var(--bad);background:var(--bad-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;resize:vertical;line-height:1.6}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f > input,label.f > select,label.f > textarea{color:var(--ink);font-size:14px;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.vio{background:var(--violet-soft);color:var(--violet)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right}
.t td.c,.t th.c{text-align:center}
.scroll{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:13.5px}

.banner{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.banner b{color:var(--warn)}

/* 다이어리 */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.9fr);gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:330px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border-bottom:1px solid var(--line)}
.day .dh b{font-family:var(--font-display);font-size:15px}
.day.today .dh b,.day.today .dh .num{color:var(--accent)}
.day .tags{display:flex;flex-direction:column;gap:4px;padding:8px 10px 0}
.dtag{display:flex;gap:7px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);cursor:pointer;width:100%;font-size:12.5px;line-height:1.45}
.dtag:hover{border-color:var(--muted)}
.dtag-k{flex:none;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px}
.dtag-b{display:flex;flex-direction:column;gap:1px;min-width:0;word-break:break-word}
.dtag-row{display:block}
.dtag-row .nm{white-space:nowrap;font-weight:500}
.dtag-row .dot{margin-right:4px;vertical-align:1px}
.ev-tag{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.ev-tag .dtag-k{background:var(--accent);color:var(--surface)}
.att-tag .dtag-k{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.dh-btn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px}
.dh-btn:hover{background:var(--bg)}
.wkend .dh-btn{padding:8px 12px}
.mcell{min-height:118px;overflow:hidden}
.mline{font-size:11.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
.mev{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px;font-weight:500}
.mdone{color:var(--muted);text-decoration:line-through}
.subj{display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:3px 8px;border-radius:7px;font-size:13px;font-weight:600;white-space:nowrap;gap:3px;background:hsl(var(--h) var(--s,70%) 92%);color:hsl(var(--h) var(--s,55%) 28%)}
.subj.sm{min-width:34px;padding:0 5px;font-size:11.5px;border-radius:5px}
.subj.sp{outline:1.5px dashed hsl(var(--h) 45% 45%);outline-offset:-1.5px}
.sp-tag{font-style:normal;font-size:9.5px;font-weight:700;margin-left:3px;padding:0 3px;border-radius:3px;background:hsl(var(--h) 45% 40%);color:#fff;vertical-align:1px}
.subj.sm .sp-tag{font-size:8.5px;margin-left:2px;padding:0 2px}
.empty-subj{background:transparent;color:var(--muted);font-weight:400}
.subj-btn{border:1px solid transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-weight:600;background:hsl(var(--h) 70% 92%);color:hsl(var(--h) 55% 28%)}
.subj-btn.on{outline:2px solid var(--ink);outline-offset:2px}
.subj-btn.erase{background:var(--bg);color:var(--muted);border-color:var(--line)}
.subj-btn.addsub{background:var(--surface);color:var(--accent);border:1px dashed var(--accent)}
.tt-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px;border-radius:10px;background:var(--bg)}
.tt-add input{width:260px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .subj,:root:not([data-theme="light"]) .subj-btn:not(.erase):not(.addsub){background:hsl(var(--h) 30% 24%);color:hsl(var(--h) 70% 82%)}}
:root[data-theme="dark"] .subj,:root[data-theme="dark"] .subj-btn:not(.erase):not(.addsub){background:hsl(var(--h) 30% 24%);color:hsl(var(--h) 70% 82%)}
.tt-table{border-collapse:separate;border-spacing:6px;width:100%;min-width:560px;table-layout:fixed}
.tt-table th{font-weight:600;font-size:13px;padding:4px;vertical-align:bottom}
.tt-table th.tt-p{text-align:left;vertical-align:middle}
.tt-table th:first-child{width:76px}
.tt-table td{padding:0}
.tt-cell{width:100%;min-height:56px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:6px 4px;font:inherit}
.tt-cell:hover{border-color:var(--muted)}
.tt-cell.changed{border-color:var(--warn);border-style:dashed}
.tt-badge{position:absolute;top:2px;right:4px;font-size:10px;color:var(--warn);font-weight:600}
.tt-badge.static{position:static}
.look-sw{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13.5px}.look-sw i{width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--cs)}.look-sw.on{border-color:var(--c);font-weight:600}
.show-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px 5px 8px;border:1px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer;background:var(--surface);color:var(--muted)}.show-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.ct-t td{vertical-align:middle;padding:5px 6px}.ct-t .ct-r1 td{border-bottom:none;padding-bottom:2px}.ct-t .ct-r2 td{padding-top:2px}.ct-addr{display:flex;align-items:center;gap:8px}.ct-addr .ct-in{flex:1}.ct-pair{display:flex;gap:4px}.ct-name{white-space:nowrap;font-weight:500}.ct-in{padding:5px 7px;font-size:13px;min-width:0}
.g-bulk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:12px 0 8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg-soft,#f7f7f5)}
.g-bulk.on{justify-content:space-between;border-color:var(--accent);background:var(--accent-soft);position:sticky;top:0;z-index:2}
.g-picking .g-row{cursor:pointer}.g-picking .g-row.on td{background:var(--accent-soft)}
.ep-done{display:inline-flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;color:var(--muted)}.ep-done.on{color:var(--ok);font-weight:600}.ep-dd{width:128px;margin-left:6px;padding:3px 6px;font-size:12.5px}
.tt-memo{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;line-height:1.3;text-align:left}
.wg-t td{vertical-align:top;min-width:130px;padding:6px}
.ttl{display:flex;flex-direction:column;gap:14px}.ttl-day{border:1px solid var(--line);border-radius:12px;padding:8px 10px}.ttl-day.on{border-color:var(--accent)}.ttl-h{margin-bottom:4px}
.ttl-row{display:grid;grid-template-columns:62px auto 1fr;align-items:start;gap:4px 8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 2px;font:inherit;cursor:pointer;color:inherit}
.ttl-row:first-of-type{border-top:0}.ttl-row.changed .subj{outline:1.5px dashed var(--warn)}.ttl-p{display:flex;flex-direction:column;font-size:13px;font-weight:600;line-height:1.3}.ttl-p .muted{font-weight:400;font-size:11.5px}
.ttl-memo{grid-column:3;font-size:13px;color:var(--ink);white-space:normal;word-break:keep-all;overflow-wrap:anywhere;line-height:1.45}.ttl-s{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
@media (max-width:760px){.wg-t{min-width:0!important;border-spacing:0}.wg-t thead{display:none}.wg-t,.wg-t tbody,.wg-t tr,.wg-t td,.wg-t th{display:block;width:auto!important}
  .wg-t tr{border-top:1px solid var(--line);padding:6px 0}.wg-t th.tt-p{padding:4px 0}.wg-t td{min-width:0;padding:4px 0 6px 10px}.wg-t td:empty{display:none}
  .wg-t td::before{content:attr(data-day);display:block;font-size:11.5px;color:var(--muted)}}.wg-c{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:3px}.wg-t .pill{font-size:10.5px;padding:1px 6px}
th.tt-today,td.tt-today .tt-cell{border-color:var(--accent)}
th.tt-today{color:var(--accent)}
.tt-day{display:flex;flex-direction:column;gap:6px}
.tt-hours{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.tt-h{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:3px 8px 3px 4px;font-size:13px}
.tt-row{display:grid;grid-template-columns:86px 64px 34px 1fr;gap:8px;align-items:center}
.tt-row .subj{justify-self:start}
.tt-row .tt-pn{font-weight:600}
.tt-memo-in{width:100%;padding:5px 9px}
.tt-memo-txt{color:var(--muted);font-size:13px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
textarea.tt-memo-in{resize:none;overflow:hidden;line-height:1.45;min-height:34px;word-break:keep-all;overflow-wrap:anywhere;field-sizing:content}
.tt-row{align-items:start}.tt-row > .tt-pn,.tt-row > .subj{margin-top:6px}
.tt-mini{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;padding:6px 7px;background:var(--surface);cursor:pointer;font:inherit;text-align:left;width:100%}
.tt-mini:hover{border-color:var(--muted)}
.tt-mrow{display:flex;align-items:center;gap:5px;font-size:11.5px;min-width:0}
.tt-mmemo{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:480px){.tt-row{grid-template-columns:52px 60px 1fr}.tt-row > span:nth-child(3){display:none}}
.sum-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sum-stats > div{border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.sum-stats > div.wide{grid-column:1/-1;flex-direction:row;gap:10px;align-items:baseline}

.menu-btn{display:none}
.app.no-side{grid-template-columns:1fr}

async function saveFile(filename, data){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const dl = await window.claude.use("downloads");
      if(dl){ await dl.save({filename, data}); toast("파일을 저장했어요"); return true; }
    }
  }catch(e){ if(e && e.code === "declined") return false; }
  try{
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    return true;
  }catch(e){ toast("이 화면에서는 파일을 저장할 수 없어요"); return false; }
}
function buildXlsx(sheets){
  const wb = XLSX.utils.book_new();
  sheets.forEach(([n, rows]) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = (rows[0]||[]).map(()=>({wch:14})); XLSX.utils.book_append_sheet(wb, ws, n.slice(0,31)); });
  return XLSX.write(wb, {type:"array", bookType:"xlsx"});
}
function saveXlsx(filename, sheets){ // sheets: [[name, rows]]
  if(window.XLSX) return saveFile(filename + ".xlsx", new Blob([buildXlsx(sheets)]));
  const csv = "\uFEFF" + sheets.map(([n,rows]) => rows.map(r => r.map(c => `"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n")).join("\n\n");
  return saveFile(filename + ".csv", csv);
}

      }catch(err){

        const msg = {needs_login:"구글 연결이 끊겼어요. 설정에서 '지금 동기화'를 누른 뒤 다시 해 주세요.", needs_reauth:"구글 드라이브 커넥터를 다시 연결해 주세요(claude.ai 설정 → 커넥터).", server_not_connected:"구글 드라이브 커넥터가 연결되어 있지 않아요.", not_in_manifest:"이 앱의 드라이브 사용을 허용해 주세요.", approval_required:"드라이브 사용을 허용해 주세요.", forbidden:"구글이 요청을 거절했어요. 개인 구글 계정으로 해 보세요."}[c] || "구글 시트를 만들지 못했어요.";
        box.innerHTML = `<div style="color:var(--bad)">${esc(msg)} <span class="small muted">[${esc(c||"")}${err&&err.message?": "+esc(String(err.message).slice(0,120)):""}]</span></div><button class="btn" data-k="x" style="padding:10px">대신 엑셀 파일로 받기</button>`;

function abToB64(buf){ const u = new Uint8Array(buf); let s = ""; for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000)); return btoa(s); }
async function makeGoogleSheet(filename, sheets){
  const buf = buildXlsx(sheets), title = `${filename} (${today()})`;
  if(!SY.sheetFolderId) { SY.sheetFolderId = (await drv.findFolder(SHEET_FOLDER)) || (await drv.createFolder(SHEET_FOLDER)); saveSY(); }
  const XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  if(GMODE){
    const b = "cbx" + Date.now(), meta = JSON.stringify({name:title, parents:[SY.sheetFolderId], mimeType:"application/vnd.google-apps.spreadsheet"});
    const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: ${XLSX_MIME}\r\n\r\n`, buf, `\r\n--${b}--`]);
    const r = await (await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink", {method:"POST", headers:{"Content-Type":`multipart/related; boundary=${b}`}, body})).json();
    return r.webViewLink || (r.id ? `https://docs.google.com/spreadsheets/d/${r.id}/edit` : "");
  }
  const r = await gd("create_file", {title, parentId:SY.sheetFolderId, base64Content:abToB64(buf), contentMimeType:XLSX_MIME});
  return (r && (r.viewUrl || (r.id ? `https://docs.google.com/spreadsheets/d/${r.id}/edit` : ""))) || "";
}

}

function attRangeRows(from, to){

  Object.entries(S.attendance).filter(([d])=>d >= from && d <= to).forEach(([d,obj]) => Object.entries(obj).forEach(([sid,r]) => {

    if(r.kind==="결석") (r.reason==="체험학습" ? o.체험학습++ : o[r.reason+"결석"]++); else o[r.kind]++;

      const a = L[i]; let j = i;
      if(a.r.kind==="결석") while(j+1 < L.length){ const b = L[j+1]; if(b.r.kind==="결석" && b.r.reason===a.r.reason && (b.r.note||"")===(a.r.note||"") && schoolStep(L[j].d, 1)===b.d) j++; else break; }

      i = j;
    }
  });
  return rows;
}

function attFieldRows(y, m){

  const out = [];
  Object.entries(by).forEach(([sid, arr]) => {

const isSchoolDay = d => { const w = parse(d).getDay(); return w!==0 && w!==6 && !offName(d); };
function schoolStep(d, dir){ let x = parse(d); for(let i=0;i<40;i++){ x = addDays(x, dir); const k = ymd(x); if(isSchoolDay(k)) return k; } return ""; }
/* 같은 학생이 같은 사유로 '결석'한 날이 등교일 기준으로 이어진 묶음 */
function attRun(sid, d){

  const same = k => { const r = S.attendance[k]?.[sid]; return r && r.kind==="결석" && r.reason===r0.reason; };
  const L = [d]; let k = d; while((k = schoolStep(k,-1)) && same(k)) L.unshift(k); k = d; while((k = schoolStep(k,1)) && same(k)) L.push(k);
  return L;
}

A.attFill = el => { const sid = el.dataset.s, r = S.attendance[ui.attDay]?.[sid], end = $(`#af-${sid}`)?.value;

/* ───────── 자리 배치 ───────── */
function seatFix(){ const st = S.seats, n = st.rows*st.cols; st.map = (st.map||[]).slice(0,n); while(st.map.length<n) st.map.push(null);
  if(st.gapC === undefined){ st.gapC = st.pair ? 2 : 0; st.gapR = 0; st.layout = st.pair ? "pair" : "row"; }
  st.off = (st.off||[]).filter(i=>i<n); const off = new Set(st.off);
  const ids = new Set(S.students.map(s=>s.id)); st.map = st.map.map((x,i) => ids.has(x) && !off.has(i) ? x : null);

  if(pool.length > free.length) msgs.push(`자리보다 학생이 ${pool.length-free.length}명 많아요`);
  free.forEach(i=>map[i]=null);

  const need = {}; free.forEach(i=>{ if(st.gfix[i]) need[i] = st.gfix[i]; });
  if(pairMode){

/* ───────── 업무 관리 ───────── */
const TASK_CATS = ["학급","학년","공문·보고","행사","기타"];

const taskCats = () => [...new Set(TASK_CATS.concat((S.tasks||[]).map(t=>t.cat).filter(Boolean)))];

/* 목록에서 고르기 + '직접 입력' (고르면 옆에 입력 칸이 열린다) */
function combo(id, opts, val, o){ o = o || {}; val = val || ""; opts = [...new Set(opts.filter(Boolean))];

function fieldVal(id){ const el = document.getElementById(id); if(!el) return ""; if(el.tagName==="SELECT" && el.value==="__custom") return (document.getElementById(id+"-x")?.value || "").trim(); return String(el.value || "").trim(); }
CH.comboSel = el => { const x = document.getElementById(el.id + "-x"); if(!x) return; const on = el.value === "__custom"; x.classList.toggle("combo-off", !on); if(on) x.focus(); };
const dlist = (id, arr) => `<datalist id="${id}">${arr.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`;
const taskPill = c => ({"학급":"acc","학년":"vio","공문·보고":"warn","행사":"ok"})[c] || "";
function taskGroup(t){ if(t.done) return "완료"; if(!t.due) return "기한 없음"; const td = today(); if(t.due < td) return "기한 지남"; if(t.due === td) return "오늘"; return t.due <= ymd(addDays(new Date(),7)) ? "7일 안" : "나중에"; }

VIEWS.tasks = () => {

  if(tab==="all") return header("업무 관리", sub, tabs) + allWorkView();

    <label class="f">업무<input type="text" id="tTitle" placeholder="예: 학교폭력 예방교육 결과 보고" data-enter="taskAdd"></label>

    <button class="btn pri" data-act="taskAdd">업무 추가</button></div></div>

    <div class="seg" style="margin-bottom:10px"><button class="${f==="open"?"on":""}" data-act="taskFilter" data-v="open">할 일</button><button class="${f==="done"?"on":""}" data-act="taskFilter" data-v="done">완료</button><button class="${f==="all"?"on":""}" data-act="taskFilter" data-v="all">전체</button></div>
    ${groups.length ? groups.map(([g,l])=>`<div class="task-group"><div class="task-gh ${g==="기한 지남"?"bad":""}">${g} <span class="muted">${l.length}</span></div>${l.map(taskRow).join("")}</div>`).join("") : `<div class="empty">${f==="done"?"완료한 업무가 없어요":"할 일이 없어요. 위에서 업무를 추가해 보세요"}</div>`}
  </div>`;
};

const CS_WHO = ["학생","어머니","아버지","보호자","기타"];

/* 같은 내용으로 여러 번 하는 상담은 하나의 묶음(thread)으로 이어서 기록한다 */
const csKey = c => c.thread || c.id;
function csThreads(list, sel){
  if(!list.length) return `<div class="empty">상담 기록이 없어요</div>`;
  const G = {}; list.forEach(c => (G[csKey(c)] ||= []).push(c));

    .sort((a,b)=>{ const la = a[a.length-1], lb = b[b.length-1]; return (lb.date+lb.time).localeCompare(la.date+la.time); });
  return groups.map(l => {
    const first = l[0], last = l[l.length-1], key = csKey(first), multi = l.length > 1, f = ui.csFollow;
    return `<div class="cs-thread ${multi?"multi":""}">

      ${l.map((c,n)=>`<div class="it"><div class="dt num">${multi?`<b class="cs-n">${n+1}차</b><br>`:""}${c.date.replace(/-/g,". ")}${c.time?`<br>${esc(c.time)}`:""}</div>
        <div style="display:flex;flex-direction:column;gap:4px;min-width:0">${multi ? `<div class="small muted">${esc(c.who)} · ${esc(c.how)}</div>` : `<div class="row" style="gap:6px">${sel==="all"?`<b>${esc(sname(c.sid))}</b>`:""}<span class="pill vio">${esc(c.topic)}</span><span class="small muted">${esc(c.who)} · ${esc(c.how)}</span></div>`}
          <div class="tx">${esc(c.content)||'<span class="muted">(내용 없음)</span>'}</div>
          ${c.followup?`<div class="small"><b>후속 조치</b> ${esc(c.followup)}</div>`:""}
          ${c.next?`<div class="small muted">다음 상담 ${md(c.next)}</div>`:""}</div>
        <div class="row" style="align-items:flex-start"><button class="btn sm ghost" data-act="csEditOpen" data-id="${c.id}">고치기</button><button class="x" data-act="csDel" data-id="${c.id}" aria-label="삭제">×</button></div></div>`).join("")}
      ${f && f.th===key ? `<div class="cs-follow"><div class="small" style="font-weight:600;margin-bottom:6px">${l.length+1}차 상담 이어서 기록 <span class="muted" style="font-weight:400">· ${esc(sname(first.sid))} · ${esc(first.topic)}</span></div>

/* ───────── 학생 종합 · 종합의견 ─────────
   학생 기록 + 상담 기록 + 출결·제출·성적·역할을 한 학생 기준으로 모아 보고, 학기별 종합의견을 쓴다. */
function termRange(term){
  const c = CAL(), Y = c.year;
  if(term==="1") return [`${Y}-03-01`, ymd(addDays(parse(c.t2[0]),-1))];   // 1학기: 3월 1일 ~ 2학기 개학식 전날(여름방학 포함)
  if(term==="2") return [c.t2[0], yearEnd(Y)];                             // 2학기: 개학식 ~ 학년도 끝(2월 말일)
  return [`${Y}-03-01`, yearEnd(Y)];
}
const termName = t => t==="1" ? "1학기" : t==="2" ? "2학기" : "올해 전체";
function defaultTerm(){ return today() < CAL().t2[0] ? "1" : "2"; }
const inRange = (d, [a,b]) => d >= a && d <= b;
function studentDigest(sid, term){
  const R = termRange(term);
  const recs = S.records.filter(r=>r.sid===sid && inRange(r.date,R)).sort((a,b)=>a.date.localeCompare(b.date));
  const cs = (S.counsels||[]).filter(c=>c.sid===sid && inRange(c.date,R)).sort((a,b)=>a.date.localeCompare(b.date));
  const att = {}; Object.entries(S.attendance).forEach(([d,o])=>{ if(inRange(d,R) && o[sid]){ const r = o[sid]; const k = r.kind==="결석" ? (r.reason==="체험학습"?"체험학습":"결석") : r.kind; att[k] = (att[k]||0)+1; } });
  const asg = S.assignments.filter(a=>inRange(a.due,R) && !isEx(a,sid)); const miss = asg.filter(a=>!a.submitted[sid]);
  const grades = S.assessments.filter(a=>inRange(a.date,R) && a.scores[sid]!==undefined && a.scores[sid]!=="").map(a=>({t:`${a.subject} ${a.title}`, v: a.mode==="score" ? `${a.scores[sid]}/${a.max}점` : a.scores[sid]}));
  const roles = [];
  (S.jobs.history||[]).filter(h=>inRange(ymd(new Date(h.at)),R)).forEach(h=>Object.entries(h.assign).forEach(([jid,a])=>{ if(a.includes(sid)) roles.push(h.names?.[jid]||""); }));
  (S.roles?.history||[]).filter(h=>inRange(ymd(new Date(h.at)),R)).forEach(h=>{ const rid = h.assign[sid]; if(rid) roles.push(h.names[rid]||""); });
  if(S.roles && S.roles.assign[sid]){ const n = S.roles.list.find(x=>x.id===S.roles.assign[sid])?.name; if(n) roles.push(n); }
  const freq = list => { const m = {}; list.forEach(r=>{ m[r.text] = (m[r.text]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const praise = recs.filter(r=>r.cat==="칭찬"), issues = recs.filter(r=>r.cat!=="칭찬" && r.cat!=="상담");
  return {R, recs, cs, att, asg, miss, grades, roles:[...new Set(roles.filter(Boolean))], praise, issues, praiseF:freq(praise), issueF:freq(issues)};
}
function digestNotes(D){
  const L = [];
  if(D.praiseF.length) L.push("칭찬: " + D.praiseF.map(([t,n])=>n>1?`${t}(${n}회)`:t).join(", "));
  if(D.issueF.length) L.push("지도할 점: " + D.issueF.map(([t,n])=>n>1?`${t}(${n}회)`:t).join(", "));
  if(D.roles.length) L.push("맡은 역할: " + D.roles.join(", "));
  if(D.cs.length) L.push("상담: " + D.cs.map(c=>`${md(c.date)} ${c.topic}(${c.who})${c.followup?" → "+c.followup:""}`).join(" / "));
  if(D.grades.length) L.push("평가: " + D.grades.map(g=>`${g.t} ${g.v}`).join(", "));
  const a = Object.entries(D.att).map(([k,n])=>`${k} ${n}`).join(", "); if(a) L.push("출결: " + a);
  if(D.asg.length) L.push(`과제: ${D.asg.length}개 중 ${D.asg.length-D.miss.length}개 제출`);
  return L.map(x=>"- "+x).join("\n");
}
const neisBytes = s => [...String(s)].reduce((n,ch)=> n + (ch==="\n" ? 2 : /[\u0000-\u007f]/.test(ch) ? 1 : 3), 0);

      return tok.split(/\s+/);

function drawShow(title, items){
  return new Promise(done => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal draw-modal"><div class="spread"><h3>${esc(title)}</h3><span class="small muted num" id="drawCnt">0 / ${items.length}</span></div>
      <div class="draw-stage"><div class="draw-label" id="drawLabel">&nbsp;</div><div class="draw-roll" id="drawRoll">준비</div></div>
      <div class="draw-list" id="drawList"></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-k="all">결과 바로 보기</button><button class="btn pri" data-k="next">${items.length>1?"한 명씩 뽑기":"뽑기"}</button></div></div>`;
    document.body.appendChild(bg);
    const $$ = id => bg.querySelector("#"+id); let i = 0, busy = false, timer = null;
    const addDone = it => { $$("drawList").insertAdjacentHTML("beforeend", `<div class="draw-item"><span>${esc(it.label)}</span><b>${esc(it.result)}</b></div>`); $$("drawList").scrollTop = 1e6; $$("drawCnt").textContent = `${i} / ${items.length}`; };
    const finish = () => { const b = bg.querySelector('[data-k="next"]'); b.textContent = "닫기"; b.dataset.k = "close"; bg.querySelector('[data-k="all"]').remove(); $$("drawLabel").textContent = "추첨 끝"; $$("drawRoll").textContent = "🎉"; };
    const step = () => { if(busy || i >= items.length) return; busy = true; const it = items[i], pool = it.pool.length ? it.pool : [it.result];
      $$("drawLabel").textContent = it.label; const roll = $$("drawRoll"); roll.classList.add("rolling"); let n = 0, wait = 45;
      const tick = () => { roll.textContent = pool[Math.floor(Math.random()*pool.length)]; n++; if(n < 18){ wait *= 1.1; timer = setTimeout(tick, wait); } else { roll.textContent = it.result; roll.classList.remove("rolling"); roll.classList.add("hit"); setTimeout(()=>roll.classList.remove("hit"), 400); i++; addDone(it); busy = false; if(i >= items.length) finish(); } };
      tick(); };
    bg.addEventListener("click", e => { const k = e.target.closest("[data-k]")?.dataset.k;
      if(k==="next") step();
      else if(k==="all"){ clearTimeout(timer); busy = false; const roll = $$("drawRoll"); roll.classList.remove("rolling"); while(i < items.length){ i++; addDone(items[i-1]); } finish(); }
      else if(k==="close" || (e.target===bg && i >= items.length)){ bg.remove(); done(); } });
  });
}

function b64utf8(b){ b = String(b).replace(/-/g,"+").replace(/_/g,"/"); const bin = atob(b); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }

const G_REDIRECT = location.origin + "/";
const G_TOK_KEY = KEY + "-gtok", G_INTENT_KEY = KEY + "-gintent";
try{ const t = JSON.parse(localStorage.getItem(G_TOK_KEY) || "null"); if(t && t.exp > Date.now()){ gTok = t.tok; gTokExp = t.exp; } }catch(e){}
let gReturn = null;   // 구글에서 돌아온 결과 {ok, err, intent}
(function parseGoogleReturn(){
  if(!GMODE) return;
  const h = location.hash.slice(1);
  if(!/(^|&)(access_token|error)=/.test(h)) return;
  const p = new URLSearchParams(h);
  let intent = null; try{ intent = JSON.parse(localStorage.getItem(G_INTENT_KEY) || "null"); localStorage.removeItem(G_INTENT_KEY); }catch(e){}
  if(!intent || intent.state !== p.get("state")){ gReturn = {err:{code:"auth_state", message:"로그인 확인값이 맞지 않아요"}}; }
  else if(p.get("error")){ gReturn = {err:{code: p.get("error")==="access_denied" ? "auth_denied" : "auth_error", message:p.get("error")}, intent}; }
  else {
    gTok = p.get("access_token"); gTokExp = Date.now() + (Number(p.get("expires_in")||3600) - 120)*1000;
    try{ localStorage.setItem(G_TOK_KEY, JSON.stringify({tok:gTok, exp:gTokExp})); }catch(e){}
    SY.gGranted = true; saveSY(); gReturn = {ok:true, intent};
  }
  history.replaceState(null, "", location.pathname + location.search + (intent && intent.route ? "#" + intent.route : ""));
})();
const gTokenOk = () => gTok && Date.now() < gTokExp;
function gLogin(action){
  const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try{ localStorage.setItem(G_INTENT_KEY, JSON.stringify({state, action, route: location.hash.slice(1)})); }catch(e){}
  const q = new URLSearchParams({client_id:GOOGLE_CLIENT_ID, redirect_uri:G_REDIRECT, response_type:"token", scope:DRIVE_SCOPE, include_granted_scopes:"true", state});

async function gfetch(url, opt={}){
  if(!gTokenOk()) throw {code:"needs_login"};
  let r;
  try{ r = await fetch(url, Object.assign({}, opt, {headers:Object.assign({Authorization:"Bearer "+gTok}, opt.headers||{})})); }
  catch(e){ throw {code:"server_unavailable", message:"인터넷 연결을 확인해 주세요"}; }
  if(r.status===401){ gTok = ""; throw {code:"needs_login"}; }
  if(r.status===403 || r.status===429){ throw {code: r.status===429 ? "server_unavailable" : "forbidden", message:(await r.text()).slice(0,200)}; }
  if(r.status>=500) throw {code:"server_unavailable"};
  if(!r.ok) throw {code:"http_"+r.status, message:(await r.text()).slice(0,200)};
  return r;
}
const GAPI = "https://www.googleapis.com/drive/v3/files";

  async list(fid){ const r = await (await gfetch(`${GAPI}?${qs({q:`'${fid}' in parents and trashed = false`, orderBy:"modifiedTime desc", pageSize:200, fields:"files(id,name)", spaces:"drive"})}`)).json(); return (r.files||[]).map(f=>({id:f.id, title:f.name})); },

  limit: 4500000

  async createFolder(name){ return (await gd("create_file", {title:name, contentMimeType:"application/vnd.google-apps.folder"})).id; },

  async download(id){ const r = await gd("download_file_content", {fileId:id}); return b64utf8(r.content); },
  async trash(id){ await gd("trash_file", {fileId:id}); },

  try{ for(const id of todo){ const top = ids[id].sort((a,b)=>b.rev-a.rev)[0]; const j = await readRemote(top);
      if(!j.data.cls || !j.data.cls.name) continue;
      try{ localStorage.setItem(dataKey(id), JSON.stringify(j.data)); }catch(e){ continue; }
      saveSYof(id, Object.assign(SY_DEF(), {on:true, folderId:SY.folderId, rev:j.savedAt, state:"ok", lastOk:Date.now()}));
      REG.list.push({id, name:j.data.cls.name, year:j.data.cls.year||""}); saveReg(); toast(`드라이브에서 '${j.data.cls.name}' 학급을 가져왔어요`); }
    render(); }
  catch(e){} finally{ discovering = false; }
}
async function readRemote(f){
  const j = JSON.parse(await drv.download(f.id));
  if(!j || !j.data || !Array.isArray(j.data.students)) throw {code:"bad_file", message:"학급일지 백업 파일이 아니에요"};
  return j;
}
function applyRemote(j){
  syncApplying = true; S = Object.assign(blank(), j.data); persist(); syncApplying = false;
  Object.assign(SY, {rev:j.savedAt, dirty:false, lastOk:Date.now(), state:"ok", msg:""}); saveSY(); render();
}
async function uploadNow(){
  const fid = await ensureFolder(), savedAt = Date.now();
  const text = JSON.stringify({app:"classbook", v:1, savedAt, data:S});
  if(new Blob([text]).size > drv.limit) throw {code:"too_large"};
  await drv.upload(fid, `학급일지_${fileTag()}${savedAt}.json`, text);
  Object.assign(SY, {rev:savedAt, dirty:false, lastOk:Date.now(), state:"ok", msg:""}); saveSY();
}
async function cleanupRemote(){ try{ const l = await listRemote(); for(const f of l.slice(GD_KEEP)) await drv.trash(f.id); }catch(e){} }
async function syncCycle(reason){
  if(!SY.on || syncing || syncConflict) return;
  if(syncPaused && reason!=="manual") return;
  syncPaused = false; syncing = true; clearTimeout(syncUpTimer);
  const prev = SY.state; SY.state = "busy"; renderSyncBits();
  try{
    const top = (await listRemote())[0];
    if(top && top.rev > SY.rev){
      if(!SY.dirty || S.isSample){ applyRemote(await readRemote(top)); if(reason!=="manual" || prev!=="ok") toast("드라이브에서 최신 기록을 불러왔어요"); }
      else { syncConflict = top; Object.assign(SY, {state:"conflict", msg:"다른 기기에서 저장한 기록이 있어요. 어느 쪽을 쓸지 골라 주세요."}); saveSY(); render(); }
    } else if(SY.dirty && S.cls.name){ await uploadNow(); cleanupRemote(); if(reason==="manual") toast("드라이브에 저장했어요"); }
    else { Object.assign(SY, {state:"ok", msg:"", lastOk:Date.now()}); saveSY(); if(reason==="manual") toast("이미 최신이에요"); }
  }catch(e){ const c = syncErr(e); if(c==="server_unavailable") setTimeout(()=>syncCycle("retry"), 30000 + Math.random()*15000); }
  finally{ syncing = false; if(SY.state==="busy") SY.state = SY.dirty ? "pending" : "ok"; saveSY(); renderSyncBits(); }
}
function agoText(ts){ if(!ts) return "아직 없음"; const m = Math.floor((Date.now()-ts)/60000); return m<1 ? "방금" : m<60 ? `${m}분 전` : new Date(ts).toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"numeric", minute:"2-digit"}); }
function syncLine(){
  if(!SY.on) return {c:"var(--muted)", t:"드라이브 자동 백업 꺼짐"};
  return ({busy:{c:"var(--accent)", t:"드라이브와 맞추는 중…"}, pending:{c:"var(--warn)", t:"바뀐 내용 저장 대기 중"}, conflict:{c:"var(--bad)", t:"어느 기록을 쓸지 골라 주세요"}, error:{c:"var(--bad)", t:"드라이브 동기화 멈춤"}})[SY.state] || {c:"var(--ok)", t:`드라이브 저장됨 · ${agoText(SY.lastOk)}`};
}
function renderSyncBits(){
  const l = syncLine(), el = document.getElementById("syncSide"); if(el) el.innerHTML = `<span class="dot" style="background:${l.c}"></span>${l.t}`;
  const p = document.getElementById("syncPanel"); if(p) p.innerHTML = syncPanelInner();
}
function syncBanner(){
  if(!SY.on) return "";
  if(SY.state==="conflict" && syncConflict) return `<div class="banner" style="background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)"><div><b style="color:var(--bad)">기록이 서로 달라요.</b> ${agoText(syncConflict.rev)}에 다른 기기에서 저장한 기록과 이 기기의 기록이 달라요.</div><div class="row"><button class="btn sm" data-act="syncUseRemote">드라이브 기록 불러오기</button><button class="btn sm pri" data-act="syncUseLocal">이 기기 기록으로 덮어쓰기</button></div></div>`;
  if(SY.state==="error") return `<div class="banner"><div><b>드라이브 자동 백업이 멈췄어요.</b> ${esc(SY.msg)}</div><button class="btn sm" data-act="syncNow">지금 동기화</button></div>`;
  return "";
}
function syncPanelInner(){
  const l = syncLine();
  return `<div class="backup-state" style="font-size:14px"><span class="dot" style="background:${l.c}"></span>${l.t}</div>
    ${SY.msg && (SY.on || SY.state==="error") ? `<div class="small" style="color:var(--bad)">${esc(SY.msg)}</div>` : ""}
    <div class="row">${SY.on ? `<button class="btn pri" data-act="syncNow">지금 동기화</button><button class="btn" data-act="syncVersions">이전 백업 보기</button><button class="btn ghost danger" data-act="syncOff">자동 백업 끄기</button>` : `<button class="btn pri" data-act="syncOn">구글 드라이브 자동 백업 켜기</button>`}
    ${SY.folderId ? `<a class="btn ghost" href="https://drive.google.com/drive/folders/${esc(SY.folderId)}" target="_blank" rel="noopener">드라이브 폴더 열기</a>` : ""}</div>`;
}
A.syncOn = () => withLogin("syncOn", () => { Object.assign(SY, {on:true, rev:0, dirty:true, state:"busy", msg:""}); saveSY(); syncAllClasses(true); syncCycle("manual"); });
/* 자동 백업 켜기·끄기는 모든 학급에 함께 적용(다른 학급은 열 때 맞춘다) */
function syncAllClasses(on){ REG.list.forEach(c => { if(c.id===REG.cur) return; const v = loadSY(c.id); if(on && !v.on) Object.assign(v, {on:true, rev:0, dirty:true, state:"pending", folderId:v.folderId||SY.folderId}); if(!on) Object.assign(v, {on:false, state:"off", msg:""}); saveSYof(c.id, v); }); }
A.syncOff = async () => { if(await ask("구글 드라이브 자동 백업을 끌까요? 드라이브에 있는 백업 파일은 그대로 남아요.","끄기")){ Object.assign(SY, {on:false, state:"off", msg:""}); syncConflict = null; saveSY(); syncAllClasses(false); render(); } };
A.syncNow = () => withLogin("syncNow", () => syncCycle("manual"));
A.syncUseRemote = async () => { const f = syncConflict; syncConflict = null; try{ applyRemote(await readRemote(f)); toast("드라이브 기록을 불러왔어요"); }catch(e){ syncErr(e); render(); } };
A.syncUseLocal = async () => { if(!(await ask("드라이브의 최신 기록 대신 이 기기의 기록을 올릴까요? 드라이브의 그 기록은 '이전 백업 보기'에서 다시 불러올 수 있어요.","덮어쓰기"))) return;
  SY.rev = syncConflict.rev; SY.dirty = true; syncConflict = null; saveSY(); syncCycle("manual"); };
A.syncVersions = () => withLogin("syncVersions", syncVersionsOpen);
async function syncVersionsOpen(){
  let list; try{ list = await listRemote(); }catch(e){ syncErr(e); return; }
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal"><h3>드라이브의 이전 백업</h3><div class="small muted">최근 ${GD_KEEP}개까지 남아 있어요. 고르면 지금 기록이 그 시점으로 바뀌어요.</div>
    <div class="list">${list.map(f=>`<button class="li" data-k="${f.id}" data-rev="${f.rev}" style="background:none;width:100%;text-align:left"><span>${new Date(f.rev).toLocaleString("ko-KR")}</span>${f.rev===SY.rev?`<span class="pill ok">지금</span>`:""}</button>`).join("") || `<div class="empty">아직 백업이 없어요</div>`}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-k="0">닫기</button></div></div>`;
  bg.addEventListener("click", async e => { const b = e.target.closest("[data-k]"); if(!b && e.target!==bg) return; bg.remove(); if(!b || b.dataset.k==="0") return;
    if(!(await ask(`${new Date(Number(b.dataset.rev)).toLocaleString("ko-KR")} 백업으로 되돌릴까요? 지금 기록은 다음 저장 때 새 백업으로 남지 않으니, 필요하면 먼저 '백업 파일 받기'를 해 두세요.`,"되돌리기",true))) return;
    try{ const j = await readRemote({id:b.dataset.k}); applyRemote(j); SY.dirty = true; SY.rev = list[0].rev; saveSY(); syncCycle("manual"); toast("그 시점 기록으로 되돌렸어요"); }catch(err){ syncErr(err); } });
  document.body.appendChild(bg);
};
setInterval(() => { if(document.visibilityState==="visible") syncCycle("poll"); renderSyncBits(); }, 60000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="hidden"){ if(SY.dirty) syncCycle("hide"); } else syncCycle("focus"); });
/* 로그인에서 돌아온 경우: 화면을 그린 뒤 하려던 일을 이어서 */
setTimeout(resumeAfterGoogle, 50);
if(SY.on){ SY.state = SY.dirty ? "pending" : "ok"; setTimeout(()=>syncCycle("load"), 800); }
if("serviceWorker" in navigator && !window.claude && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

/* ───────── 이벤트 연결 ───────── */
/* 버튼을 눌렀는데 오류가 나면 조용히 멈추지 않고 알려 준다(선생님이 문구를 알려 주면 고치기 쉬움) */
function showErr(where, err){ const m = (err && (err.message || err.reason?.message || String(err))) || "알 수 없는 오류"; console.error(where, err);
  document.querySelectorAll(".toast").forEach(x=>x.remove()); const t = document.createElement("div"); t.className = "toast err-toast";
  t.textContent = `문제가 생겼어요 (${where}): ${m}`; document.body.appendChild(t); setTimeout(()=>t.remove(), 9000); }
window.addEventListener("error", e => showErr("화면", e.error || e.message));
window.addEventListener("unhandledrejection", e => { const m = String(e.reason && e.reason.message || e.reason || ""); if(/tool_error|server_not|not_granted|popup|auth/i.test(m)) return; showErr("작업", e.reason); });
document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if(t && !t.disabled){ const f = A[t.dataset.act]; if(f){ e.preventDefault(); try{ const r = f(t, e); if(r && r.catch) r.catch(err => showErr(t.dataset.act, err)); }catch(err){ showErr(t.dataset.act, err); } } }
  if(!e.target.closest("#side") && !e.target.closest(".menu-btn")) $("#side").classList.remove("open"); });
document.addEventListener("keydown", e => {
  if(e.key==="Enter" && !e.isComposing){ const t = e.target.closest("[data-enter]"); if(t){ e.preventDefault(); EN[t.dataset.enter](t); return; } }
  if((e.key==="Enter"||e.key===" ") && e.target.matches(".bud[data-act]")){ e.preventDefault(); A[e.target.dataset.act](e.target); }
  if(e.key==="Escape"){ ui.seatPick = null; document.querySelector(".modal-bg")?.remove(); }
});
document.addEventListener("change", e => { const t = e.target.closest("[data-ch]"); if(t && CH[t.dataset.ch]) CH[t.dataset.ch](t); });
document.addEventListener("input", e => { const t = e.target.closest("[data-in]"); if(t && IN[t.dataset.in]) IN[t.dataset.in](t); });

render();
</script>
