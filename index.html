<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학급일지</title>
<meta name="theme-color" content="#1F6E8C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* 레이아웃: 왼쪽 고정 메뉴 + 오른쪽 작업 영역. 흰 바탕에 호수색 하나만 포인트로 쓴다. */
:root{
  --bg:#F5F7F9;
  --surface:#FFFFFF;
  --ink:#18202B;
  --muted:#667085;
  --line:#E2E7EC;
  --accent:#1F6E8C;
  --accent-soft:#E7F2F6;
  --ok:#1F8A5B; --ok-soft:#E6F4EC;
  --warn:#B7700B; --warn-soft:#FBF1E1;
  --bad:#C93C3C; --bad-soft:#FBEAEA;
  --violet:#6D55C7; --violet-soft:#EFEBFA;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --font-display:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161C; --surface:#182029; --ink:#E7ECF1; --muted:#97A3B2; --line:#28323D;
    --accent:#5FB3D1; --accent-soft:#16303B;
    --ok:#4CC08A; --ok-soft:#163327; --warn:#E3A44A; --warn-soft:#3A2C14;
    --bad:#EE7777; --bad-soft:#3D1E1E; --violet:#A895F0; --violet-soft:#2A2442;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#182029; --ink:#E7ECF1; --muted:#97A3B2; --line:#28323D;
  --accent:#5FB3D1; --accent-soft:#16303B;
  --ok:#4CC08A; --ok-soft:#163327; --warn:#E3A44A; --warn-soft:#3A2C14;
  --bad:#EE7777; --bad-soft:#3D1E1E; --violet:#A895F0; --violet-soft:#2A2442;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}

.app{display:grid;grid-template-columns:224px 1fr;height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand .cls{font-family:var(--font-display);font-weight:700;font-size:18px}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav .grp{font-size:11.5px;color:var(--muted);padding:12px 10px 4px;letter-spacing:.04em}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{font-size:11px;color:var(--muted)}
.side-foot{padding:12px 16px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.backup-state{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.main{overflow-y:auto;height:100%}
.wrap{max-width:1240px;margin:0 auto;padding:26px 28px 60px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card > h2,.card > .spread{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .btn.pri,.btn.pri{color:var(--surface)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--bg)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:15px;line-height:1}
.x:hover{color:var(--bad);background:var(--bad-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;resize:vertical;line-height:1.6}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f > input,label.f > select,label.f > textarea{color:var(--ink);font-size:14px;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.vio{background:var(--violet-soft);color:var(--violet)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right}
.t td.c,.t th.c{text-align:center}
.scroll{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:13.5px}

.banner{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.banner b{color:var(--warn)}

/* 다이어리 */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.9fr);gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:330px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border-bottom:1px solid var(--line)}
.day .dh b{font-family:var(--font-display);font-size:15px}
.day.today .dh b,.day.today .dh .num{color:var(--accent)}
.day .tags{display:flex;flex-direction:column;gap:4px;padding:8px 10px 0}
.dtag{display:flex;gap:7px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);cursor:pointer;width:100%;font-size:12.5px;line-height:1.45}
.dtag:hover{border-color:var(--muted)}
.dtag-k{flex:none;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px}
.dtag-b{display:flex;flex-direction:column;gap:1px;min-width:0;word-break:break-word}
.dtag-row{display:block}
.dtag-row .nm{white-space:nowrap;font-weight:500}
.dtag-row .dot{margin-right:4px;vertical-align:1px}
.ev-tag{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.ev-tag .dtag-k{background:var(--accent);color:var(--surface)}
.att-tag .dtag-k{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.dh-btn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px}
.dh-btn:hover{background:var(--bg)}
.wkend .dh-btn{padding:8px 12px}
.mcell{min-height:104px;overflow:hidden}
.mline{font-size:11.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
.mev{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px;font-weight:500}
.mdone{color:var(--muted);text-decoration:line-through}
.todos{list-style:none;margin:0;padding:6px 6px;display:flex;flex-direction:column;gap:1px;flex:1}
.todo{display:flex;align-items:flex-start;gap:7px;padding:5px 6px;border-radius:6px}
.todo:hover{background:var(--bg)}
.todo input{margin-top:4px;accent-color:var(--accent)}
.todo span{flex:1;word-break:break-word}
.todo.done span{color:var(--muted);text-decoration:line-through}
.todo .x{visibility:hidden}
.todo:hover .x{visibility:visible}
.add{border:0;border-top:1px solid var(--line);border-radius:0 0 12px 12px;padding:9px 12px;background:transparent;width:100%}
.add:focus{box-shadow:none;background:var(--bg)}
.wkend{display:flex;flex-direction:column}
.wkend .half{flex:1;display:flex;flex-direction:column;min-height:150px}
.wkend .half+.half{border-top:1px solid var(--line)}
.wkend .half .add{border-radius:0}
.wkend .half:last-child .add{border-radius:0 0 12px 12px}
.sat{color:var(--accent)} .sun,.holi{color:var(--bad)}

/* 출석 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{text-align:center;font-size:12.5px;color:var(--muted);padding:4px 0}
.cell{border:1px solid var(--line);border-radius:9px;min-height:84px;padding:6px 7px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:3px}
.cell:hover{border-color:var(--muted)}
.cell.out{opacity:.38}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);background:var(--accent-soft)}
.cell.isToday .dn{background:var(--ink);color:var(--surface);border-radius:99px;padding:0 6px}
.cell .dn{font-size:12.5px;font-weight:600;align-self:flex-start}
.cell .who{font-size:11.5px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-체험학습{background:var(--violet)} .c-질병{background:var(--warn)} .c-인정{background:var(--ok)} .c-미인정{background:var(--bad)} .c-기타{background:var(--muted)}
.stu-att{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.sa{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.sa.has{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.sa .nm{font-weight:600}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 8px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--muted)}
.chip.on{color:#fff;border-color:transparent}
.chip.on.k-체험학습{background:var(--violet)} .chip.on.k-질병{background:var(--warn)} .chip.on.k-인정{background:var(--ok)} .chip.on.k-미인정{background:var(--bad)} .chip.on.k-기타{background:var(--muted)}
.chip.on.k-plain{background:var(--accent)}
.chip.k-per{min-width:30px;padding:3px 0;text-align:center}
.chip.on.k-per{background:var(--ink);color:var(--surface)}

/* 제출 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 8px;cursor:pointer;background:var(--surface);text-align:center;display:flex;flex-direction:column;gap:2px}
.tile .no{font-size:11.5px;color:var(--muted)}
.tile.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tile.on .no{color:var(--ok)}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.li:hover{background:var(--bg)}
.li.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.li .t1{font-weight:500}
.sub-row{width:100%;background:none;border:1px solid var(--line);margin-bottom:6px;font:inherit;color:inherit;padding:10px 12px}
.miss-all{display:flex;flex-direction:column}
.miss-row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;padding:8px 4px;border-bottom:1px solid var(--line)}
.miss-row:last-child{border-bottom:0}
.miss-row.on{background:var(--accent-soft);border-radius:8px}
.miss-nm{border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;gap:6px;align-items:center;padding:3px 4px}
.miss-chips{display:flex;gap:5px;flex-wrap:wrap}
.mchip{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 9px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.mchip:hover{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.mchip.late{border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad);background:var(--bad-soft)}
@media (max-width:480px){.miss-row{grid-template-columns:1fr}}
.sub-line{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.sub-line .sub-row{margin-bottom:0;flex:1}
.sub-line > .btn{min-width:76px}
.sub-ex .sub-row{opacity:.5;border-style:dashed;cursor:default}
.tile.ex{border-style:dashed;color:var(--muted);background:var(--bg);opacity:.75}
.tiles.ex-mode .tile{border-color:var(--warn)}
.tiles.ex-mode .tile.ex{background:var(--warn-soft);color:var(--warn);opacity:1}
.sub-row.sub-on{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.bar{height:6px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok > i{background:var(--ok)} .bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}

/* 기록 */
.tl{display:flex;flex-direction:column}
.tl .it{display:grid;grid-template-columns:92px 1fr auto;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.tl .it:last-child{border-bottom:0}
.tl .dt{color:var(--muted);font-size:12.5px}
.tl .tx{white-space:pre-wrap;word-break:break-word}

/* 성적 */
.lv{display:inline-flex;gap:3px}
.lv button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 9px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.lv button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.scoreIn{width:76px;text-align:right}

/* 예산 */
.bud{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.bud.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.big{font-family:var(--font-display);font-size:24px;font-weight:700}
.kv{display:flex;justify-content:space-between;font-size:13px}

/* 자리 */
.board{display:flex;flex-direction:column;gap:14px;align-items:center}
.desk-front{border:1px dashed var(--line);border-radius:8px;padding:6px 40px;color:var(--muted);font-size:12.5px}
.seats{display:grid;gap:8px 8px}
.seat{width:96px;height:58px;border:1px solid var(--line);border-radius:9px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:13.5px}
.seat .no{font-size:11px;color:var(--muted)}
.seat.m{border-bottom:3px solid var(--accent)}
.seat.f{border-bottom:3px solid var(--violet)}
.seat.empty{border-style:dashed;color:var(--muted)}
.seat.pick{outline:2px solid var(--warn);outline-offset:2px}
.seat.lock::after{content:"고정";position:absolute;top:3px;right:5px;font-size:10px;color:var(--warn)}
.seat.gap{margin-right:18px}
.seat.gfix-m{background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface))}
.seat.gfix-f{background:color-mix(in srgb,var(--violet-soft) 70%,var(--surface))}
.seat.gmis{outline:2px dashed var(--warn);outline-offset:1px}
.gtag{position:absolute;top:3px;left:5px;font-size:10px;font-weight:600;color:var(--accent)}
.gfix-f .gtag{color:var(--violet)}
.gtag.static{position:static;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--accent-soft)}
.gtag.static.f{color:var(--violet);background:var(--violet-soft)}

/* 랜덤 */
.stage{min-height:150px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.stage .pick{font-family:var(--font-display);font-size:46px;font-weight:700}
.order{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.order .o{border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;gap:8px;align-items:center;background:var(--surface)}
.order .o b{font-family:var(--font-display);color:var(--accent);min-width:22px}

/* 일인일역 */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{padding:6px 12px;border-radius:99px;font-size:12.5px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.step.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.step.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.job{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.job.over{border-color:var(--warn);background:color-mix(in srgb,var(--warn-soft) 50%,var(--surface))}
.job.full{opacity:.7}
.job .names{display:flex;gap:4px;flex-wrap:wrap}
.nm-chip{border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:12.5px;background:var(--surface);cursor:pointer}
.nm-chip.win{background:var(--ok);border-color:var(--ok);color:#fff}
.nm-chip.static{cursor:default}
.nm-chip.gm{border-bottom:2px solid var(--accent)} .nm-chip.gf{border-bottom:2px solid var(--violet)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.grp-card{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.grp-card .names{display:flex;gap:4px;flex-wrap:wrap}
.grp-card b{font-family:var(--font-display);color:var(--accent)}
.choose{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;align-items:flex-start;font:inherit;color:inherit}
.choose:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.choose p{margin:0;line-height:1.65}

/* 행사 */
.ev{display:grid;grid-template-columns:76px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.ev:last-child{border-bottom:0}
.ev .dd{text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 0}
.ev .dd .m{font-size:11.5px;color:var(--muted)}
.ev .dd .d{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.2}
.ev.past{opacity:.6}
.check{display:flex;gap:7px;align-items:center;font-size:13.5px;padding:2px 0}
.check input{accent-color:var(--ok)}
.check.done span{text-decoration:line-through;color:var(--muted)}

/* 오늘 */
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--font-display);font-size:26px;font-weight:700}
.stat .l{color:var(--muted);font-size:12.5px}

.modal-bg{position:fixed;inset:0;background:rgba(10,16,24,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:60;max-width:90vw}
.menu-btn{display:none}
.app.no-side{grid-template-columns:1fr}
.app.no-side .side{display:none}
.setup{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.setup-card{max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;padding:28px}
.hidden{display:none!important}

@media (max-width:1100px){
  .week{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .menu-btn{display:inline-flex}
  .wrap{padding:18px 16px 50px}
  .split,.grid2,.grid3{grid-template-columns:1fr}
  .week{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){
  .week{grid-template-columns:1fr}
  .cell{min-height:56px}
  .cell .who{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const pad = n => String(n).padStart(2, "0");

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => ymd(new Date());
const WD = ["일","월","화","수","목","금","토"];
const mondayOf = d => { const x = new Date(d); const w = x.getDay(); x.setDate(x.getDate() - ((w+6)%7)); return x; };

const md = s => { const d = parse(s); return `${d.getMonth()+1}월 ${d.getDate()}일(${WD[d.getDay()]})`; };
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const dday = s => { const diff = Math.round((parse(s) - parse(today()))/86400000); return diff === 0 ? "D-day" : diff > 0 ? `D-${diff}` : `D+${-diff}`; };

  s.weekMemo[ymd(mon)] = "이번 주 목표: 쉬는 시간 끝나면 1분 안에 자리에 앉기";

    {id:uid(), date:ymd(addDays(T,13)), time:"", title:"11월 생일 축하", type:"학급 행사", host:"", place:"교실", note:"", checklist:[{id:uid(),text:"생일 학생 확인",done:false},{id:uid(),text:"축하 카드 준비",done:false}]},
    {id:uid(), date:ymd(addDays(T,-9)), time:"09:00", title:"현장체험학습", type:"현장체험", host:"", place:"김포 아트빌리지", note:"", checklist:[{id:uid(),text:"안전교육",done:true}]}

  ];
  s.assessments = [
    {id:uid(), subject:"수학", title:"꺾은선 그래프 그리기", date:dk(1), mode:"level", levels:LEVELS.slice(), max:100,
      scores:Object.fromEntries(st.map((x,i)=>[x.id, ["매우 잘함","잘함","보통","잘함","노력 요함","매우 잘함","보통"][i%7]]))},
    {id:uid(), subject:"국어", title:"의견 글 쓰기", date:ymd(addDays(T,-8)), mode:"score", levels:LEVELS.slice(), max:20,
      scores:Object.fromEntries(st.slice(0,20).map((x,i)=>[x.id, 12 + (i*7)%9]))}
  ];
  s.budgets = [{id:uid(), name:"학급운영비", total:250000,
    cats:[{name:"간식비",pct:15},{name:"학습자료",pct:45},{name:"행사",pct:25},{name:"도서",pct:15}],
    expenses:[
      {id:uid(), date:ymd(addDays(T,-20)), cat:"학습자료", purpose:"색지·OHP 필름", amount:23800, note:""},
      {id:uid(), date:ymd(addDays(T,-10)), cat:"간식비", purpose:"학급 단합 간식", amount:31000, note:"과자 세트"},
      {id:uid(), date:ymd(addDays(T,-4)), cat:"도서", purpose:"학급문고 그림책 3권", amount:39600, note:""}
    ]}];
  s.seats = {rows:4, cols:6, pair:true, map:st.map(x=>x.id), locked:[]};
  const jobList = [["칠판 정리",2],["분리수거",2],["학급문고 관리",2],["크롬북 관리",2],["급식 도우미",3],["우편함 배달",2],["식물 관리",2],["학급 기자",2],["청소 점검",2],["전등·창문",2],["출석 확인",1],["음악 DJ",1],["은행원",1]];
  s.jobs.list = jobList.map(([name,cap]) => ({id:uid(), name, cap, desc:""}));
  s.jobs.quarter = `${T.getFullYear()}년 4분기`;
  const roleNames = ["칠판 지우기","칠판 날짜 쓰기","창문 열기","창문 닫기","불 끄기","분리수거(종이)","분리수거(플라스틱)","화분 물 주기","학급문고 정리","크롬북 충전 확인","크롬북 보관함 잠그기","신발장 정리","사물함 점검","우편함 배달","알림장 확인","급식 수저 확인","급식차 정리","교실 바닥 점검","책상 줄 맞추기","청소 도구 정리","게시판 정리","손 소독제 확인","학습지 나눠 주기","학습지 걷기"];
  s.roles.list = roleNames.map(name => ({id:uid(), name, desc:""}));
  st.forEach((x,i) => { s.roles.assign[x.id] = s.roles.list[i].id; });
  s.roles.period = "11월 2주";
  s.roles.checks[t] = Object.fromEntries(st.slice(0,15).map(x=>[x.id,true]));
  return s;
}
function defaultChecklist(type){
  const m = {
    "강사 초청":["강사 일정 확정","내부결재(품의) 올리기","강사 카드·서약서 받기","교실·기자재 준비","수업 후 강사비 지급 확인"],

let S = loadState() || sampleData();
const firstRun = !loadState();
if(S.cls && S.cls.name==="호수평화국" && S.cls.grade==="4학년 ○반") { S.cls.name = ""; S.cls.grade = ""; }

if(!S.roles) S.roles = { list:[], assign:{}, checks:{}, period:"", history:[] };
if(S.jobMode===undefined) S.jobMode = "";
if(firstRun) persist();

/* 화면 상태(저장하지 않음) */

  diaryDate: today(), diaryMode:"week",
  attMonth: today().slice(0,7), attDay: today(), attView:"day",
  submitSel:null, recSel:"all", recCat:"전체", gradeSel:null, budgetSel:null,
  eventEdit:null, memoSel:null, memoQ:"", seatPick:null, seatView:"teacher", seatMode:"",
  roleTab:"assign",
  rnd:{ mode:"one", target:"all", customText:"", exclude:{}, drawn:[], result:null, order:null, groups:null, noRepeat:true, skipAbsent:true, groupBy:"count", groupN:6, groupSize:4, mixGender:true },

};

/* ───────── 공통 ───────── */
const $ = s => document.querySelector(s);
const stu = id => S.students.find(x => x.id === id);
const clsName = () => S.cls.name || "우리 반";

function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2400); }
function ask(msg, okLabel="확인", danger=false){
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div>${msg}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-k="0">취소</button><button class="btn ${danger?"danger":"pri"}" data-k="1">${esc(okLabel)}</button></div></div>`;
    bg.addEventListener("click", e => { const k = e.target.dataset.k; if(k!=null || e.target===bg){ bg.remove(); res(k==="1"); } });
    document.body.appendChild(bg); bg.querySelector('[data-k="1"]').focus();
  });
}
async function saveFile(filename, data){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const dl = await window.claude.use("downloads");
      if(dl){ await dl.save({filename, data}); toast("파일을 저장했어요"); return true; }
    }
  }catch(e){ if(e && e.code === "declined") return false; }
  try{
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    return true;
  }catch(e){ toast("이 화면에서는 파일을 저장할 수 없어요"); return false; }
}
function exportSheets(filename, sheets){ // sheets: [[name, rows]]
  if(window.XLSX){
    const wb = XLSX.utils.book_new();
    sheets.forEach(([n, rows]) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = (rows[0]||[]).map(()=>({wch:14})); XLSX.utils.book_append_sheet(wb, ws, n.slice(0,31)); });
    const buf = XLSX.write(wb, {type:"array", bookType:"xlsx"});
    return saveFile(filename + ".xlsx", new Blob([buf]));
  }
  const csv = "﻿" + sheets.map(([n,rows]) => rows.map(r => r.map(c => `"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n")).join("\n\n");
  return saveFile(filename + ".csv", csv);
}

        ${todos.slice(0,3).map(x=>`<span class="mline ${x.done?"mdone":""}">${x.done?"✓":"·"} ${esc(x.text)}</span>`).join("")}
        ${todos.length>3?`<span class="mline muted">+${todos.length-3}개 더</span>`:""}</button>`; }).join("")}</div>
      <div class="small muted" style="margin-top:10px">날짜를 누르면 그날을 크게 보고 할 일을 적을 수 있어요.</div></div>`;
  }
  return header("다이어리", sub, seg + nav) + body;
};

const REASONS = ["체험학습","질병","인정","미인정","기타"];

const attLabel = r => (r.reason==="체험학습" ? (r.kind==="결석" ? "체험학습" : "체험학습("+r.kind+")") : r.reason + r.kind) + perText(r);
VIEWS.attendance = () => {

  const [y,m] = ui.attMonth.split("-").map(Number);
  const first = new Date(y, m-1, 1), start = addDays(first, -first.getDay());
  const cells = [];
  for(let i=0;i<42;i++){ const d = addDays(start,i); if(i>=35 && d.getMonth()!==m-1) break; cells.push(d); }
  const sel = ui.attDay, recs = S.attendance[sel] || {};
  const calHtml = `<div class="cal">${WD.map((w,i)=>`<div class="wd ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("")}${cells.map(d => { const k = ymd(d), r = Object.entries(S.attendance[k]||{});
    return `<button class="cell ${d.getMonth()!==m-1?"out":""} ${k===sel?"sel":""} ${k===today()?"isToday":""}" data-act="attDay" data-d="${k}"><span class="dn num ${d.getDay()===0||HOLI[k]?"sun":d.getDay()===6?"sat":""}">${d.getDate()}</span>${HOLI[k]?`<span class="small holi" style="font-size:11px">${HOLI[k]}</span>`:""}${r.slice(0,3).map(([sid,x])=>`<span class="who"><i class="dot c-${x.reason}"></i>${esc(sname(sid))}</span>`).join("")}${r.length>3?`<span class="who muted">+${r.length-3}명</span>`:""}</button>`; }).join("")}</div>`;
  const legend = REASONS.map(r=>`<span class="row small muted" style="gap:4px"><i class="dot c-${r}"></i>${r==="체험학습"?"교외체험학습":r}</span>`).join("");
  return header("출석 체크", "날짜를 누르고 출석이 아닌 학생만 표시하세요. 표시하지 않은 학생은 출석으로 봅니다.",
    `<div class="seg"><button class="${ui.attView==="day"?"on":""}" data-act="attView" data-v="day">날짜별 입력</button><button class="${ui.attView==="month"?"on":""}" data-act="attView" data-v="month">월별 종합</button><button class="${ui.attView==="field"?"on":""}" data-act="attView" data-v="field">체험학습 대장</button></div>`) + `
  <div class="card"><div class="spread"><div class="row"><button class="btn" data-act="attMonth" data-n="-1" aria-label="이전 달">‹</button><h2 class="num" style="min-width:110px;text-align:center">${y}년 ${m}월</h2><button class="btn" data-act="attMonth" data-n="1" aria-label="다음 달">›</button><button class="btn sm ghost" data-act="attMonth" data-n="0">이번 달</button></div><div class="row">${legend}</div></div>
  ${ui.attView==="day" ? `<div class="grid2" style="grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start">${calHtml}
    <div style="display:flex;flex-direction:column;gap:10px"><div class="spread"><h3>${md(sel)} ${HOLI[sel]?`<span class="pill bad">${HOLI[sel]}</span>`:""}</h3><span class="small muted">특이 ${Object.keys(recs).length}명 · 결석 ${Object.values(recs).filter(r=>r.kind==="결석").length}명 · 등교 ${S.students.length-Object.values(recs).filter(r=>r.kind==="결석").length}명</span></div>
    <div class="stu-att">${sorted().map(s => { const r = recs[s.id];
      return `<div class="sa ${r?"has":""}"><div class="spread"><span class="nm"><span class="muted num small">${s.no}</span> ${esc(s.name)}</span>${r?`<button class="btn sm ghost" data-act="attClear" data-s="${s.id}">출석으로</button>`:""}</div>
      <div class="chips">${REASONS.map(x=>`<button class="chip k-${x} ${r&&r.reason===x?"on":""}" data-act="attSet" data-s="${s.id}" data-r="${x}">${x}</button>`).join("")}</div>
      ${r ? `<div class="chips">${KINDS.map(k=>`<button class="chip k-plain ${r.kind===k?"on":""}" data-act="attKind" data-s="${s.id}" data-k="${k}">${k}</button>`).join("")}</div>${r.kind!=="결석" ? `<div class="chips per-chips"><span class="small muted" style="align-self:center">${r.kind==="지각"?"몇 교시에 왔나요":r.kind==="조퇴"?"몇 교시부터 빠졌나요":"빠진 교시"}</span>${PERIODS.map(n=>`<button class="chip k-per ${(r.periods||[]).includes(n)?"on":""}" data-act="attPer" data-s="${s.id}" data-n="${n}" aria-pressed="${(r.periods||[]).includes(n)}">${n}</button>`).join("")}</div>` : ""}` : ""}
      ${r ? `<input type="text" value="${esc(r.note)}" placeholder="사유 메모" data-in="attNote" data-s="${s.id}" id="an-${s.id}">` : ""}</div>`; }).join("")}</div></div></div>`
  : ui.attView==="month" ? attMonthTable(y,m) : attFieldTable(y,m)}</div>`;
};
function attMonthRows(y,m){
  const pre = `${y}-${pad(m)}-`, rows = {};
  Object.entries(S.attendance).filter(([d])=>d.startsWith(pre)).forEach(([d,obj]) => Object.entries(obj).forEach(([sid,r]) => {
    const o = rows[sid] ||= {체험학습:0, 질병결석:0, 인정결석:0, 미인정결석:0, 기타결석:0, 지각:0, 조퇴:0, 결과:0, dates:[]};
    if(r.kind==="결석") (r.reason==="체험학습" ? o.체험학습++ : o[r.reason+"결석"]++); else o[r.kind]++;
    o.dates.push(`${Number(d.slice(8))}일 ${attLabel(r)}${r.note?`(${r.note})`:""}`);
  }));
  return rows;
}
const ATT_COLS = ["체험학습","질병결석","인정결석","미인정결석","기타결석","지각","조퇴","결과"];
function attMonthTable(y,m){
  const rows = attMonthRows(y,m), list = sorted().filter(s=>rows[s.id]);
  const tot = ATT_COLS.map(c=>list.reduce((a,s)=>a+rows[s.id][c],0));
  return `<div class="spread" style="margin:4px 0 10px"><span class="small muted">${y}년 ${m}월 출결 특이사항 ${list.length}명</span><button class="btn sm" data-act="attExport">엑셀로 내보내기</button></div>
  <div class="scroll"><table class="t"><thead><tr><th>번호</th><th>이름</th>${ATT_COLS.map(c=>`<th class="r">${c}</th>`).join("")}<th>내용</th></tr></thead><tbody>
  ${list.map(s=>`<tr><td class="num">${s.no}</td><td>${esc(s.name)}</td>${ATT_COLS.map(c=>`<td class="r num">${rows[s.id][c]||""}</td>`).join("")}<td class="small">${rows[s.id].dates.map(esc).join(", ")}</td></tr>`).join("") || `<tr><td colspan="11" class="empty">이번 달 출결 특이사항이 없어요</td></tr>`}
  ${list.length?`<tr><td></td><td><b>합계</b></td>${tot.map(v=>`<td class="r num"><b>${v||""}</b></td>`).join("")}<td></td></tr>`:""}</tbody></table></div>`;
}
function attFieldRows(y, m){
  // 학생별로 체험학습 날짜를 모아 연속된 학교 날짜끼리 묶는다(주말·공휴일 건너뜀)
  const pre = y ? `${y}-${pad(m)}-` : "";
  const by = {};
  Object.keys(S.attendance).sort().filter(d=>d.startsWith(pre)).forEach(d => Object.entries(S.attendance[d]).forEach(([sid,r]) => { if(r.reason==="체험학습") (by[sid] ||= []).push({d, note:r.note, kind:r.kind||"결석"}); }));
  const out = [];
  Object.entries(by).forEach(([sid, arr]) => {
    let cur = null;
    arr.forEach(({d,note,kind}) => {
      if(kind!=="결석"){ out.push({sid, start:d, end:d, days:0, note:`${kind}${note?" · "+note:""}`}); cur = null; return; }
      if(cur){ let n = addDays(parse(cur.end),1); while(n.getDay()===0||n.getDay()===6||HOLI[ymd(n)]) n = addDays(n,1); if(ymd(n)===d){ cur.end = d; cur.days++; return; } }
      cur = {sid, start:d, end:d, days:1, note}; out.push(cur);
    });
  });
  return out.sort((a,b)=>a.start.localeCompare(b.start));
}
function attFieldTable(y,m){
  const list = attFieldRows(y,m);
  return `<div class="spread" style="margin:4px 0 10px"><span class="small muted">${y}년 ${m}월 교외체험학습 ${list.length}건 (이어진 날짜는 한 건으로 묶어요)</span><button class="btn sm" data-act="fieldExport">올해 대장 엑셀로 내보내기</button></div>
  <div class="scroll"><table class="t"><thead><tr><th>번호</th><th>이름</th><th>기간</th><th class="r">일수</th><th>내용</th></tr></thead><tbody>

VIEWS.submit = () => {
  if(!S.students.length) return header("제출 체크") + noStudents();
  const list = S.assignments.slice().sort((a,b)=>b.due.localeCompare(a.due));
  if(!ui.submitSel || !S.assignments.find(a=>a.id===ui.submitSel)) ui.submitSel = list[0]?.id || null;
  const a = S.assignments.find(x=>x.id===ui.submitSel);
  const miss = a ? asgMiss(a) : [], exN = a ? sorted().filter(s=>isEx(a,s.id)).length : 0;
  const modeSeg = `<div class="seg"><button class="${ui.submitMode!=="stu"?"on":""}" data-act="submitMode" data-v="asg">과제별</button><button class="${ui.submitMode==="stu"?"on":""}" data-act="submitMode" data-v="stu">학생별</button></div>`;

  return header("제출 체크", exMode ? "이 과제에 해당하지 않는 학생을 눌러 제외하세요. 다 골랐으면 '제외 고르기 끝'을 누르세요." : "과제를 고르고 학생 이름을 누르면 제출로 바뀌어요. 해당 없는 학생은 '제외할 학생 고르기'로 빼 두세요.", modeSeg) + `
  <div class="split">
    <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:10px">
      <div class="row"><input type="text" id="asgTitle" placeholder="새 과제 이름" style="flex:1" data-enter="addAsg"><input type="date" id="asgDue" value="${today()}" style="width:100%"></div>
      <button class="btn pri" data-act="addAsg">과제 추가</button>
      <div class="list">${list.map(x=>{ const n = asgDone(x), tot = asgTargets(x).length || 1; return `<div class="li ${x.id===ui.submitSel?"on":""}" data-act="selAsg" data-id="${x.id}" style="flex-direction:column;align-items:stretch;gap:5px"><div class="spread"><span class="t1">${esc(x.title)}</span><span class="small muted num">${n}/${asgTargets(x).length}</span></div><div class="bar ${n===asgTargets(x).length?"ok":""}"><i style="width:${n/tot*100}%"></i></div><span class="small muted">마감 ${md(x.due)}${Object.keys(x.exempt||{}).length?` · 제외 ${sorted().filter(s=>isEx(x,s.id)).length}명`:""}</span></div>`; }).join("") || `<div class="empty">과제를 추가해 보세요</div>`}</div>
    </div>
    <div class="card">${a ? `<div class="spread"><div><h2>${esc(a.title)}</h2><div class="small muted">마감 ${md(a.due)} · 대상 ${asgTargets(a).length}명 · 제출 ${asgDone(a)}명 · 미제출 ${miss.length}명${exN?` · 제외 ${exN}명`:""}</div></div>
      <div class="row"><button class="btn sm ${exMode?"pri":""}" data-act="exMode">${exMode?"제외 고르기 끝":"제외할 학생 고르기"}</button>${exMode?"":`<button class="btn sm" data-act="asgAll" data-v="1">모두 제출</button><button class="btn sm" data-act="asgAll" data-v="0">모두 해제</button>`}<button class="btn sm danger" data-act="delAsg">과제 삭제</button></div></div>
      <div class="tiles ${exMode?"ex-mode":""}" style="margin-bottom:14px">${sorted().map(s=>{ const ex = isEx(a,s.id), on = !ex && a.submitted[s.id];
        return `<button class="tile ${on?"on":""} ${ex?"ex":""}" data-act="${exMode?"asgEx":"asgToggle"}" data-s="${s.id}" ${!exMode&&ex?"disabled":""} aria-pressed="${exMode?ex:!!on}"><span class="no num">${s.no}번${ex?" · 제외":""}</span><span>${esc(s.name)}</span></button>`; }).join("")}</div>
      <div class="banner" style="background:var(--bg);border-color:var(--line)"><div><b style="color:var(--ink)">미제출</b> <span id="missTxt">${miss.length ? miss.map(s=>`${s.no} ${esc(s.name)}`).join(", ") : "모두 제출했어요"}</span></div>${miss.length?`<button class="btn sm" data-act="copyMiss">명단 복사</button>`:""}</div>` : `<div class="empty">왼쪽에서 과제를 추가하거나 골라 주세요</div>`}</div>
  </div>`;
};
function isEx(a, id){ return !!(a.exempt && a.exempt[id]); }
function asgTargets(a){ return sorted().filter(s=>!isEx(a,s.id)); }
function asgDone(a){ return asgTargets(a).filter(s=>a.submitted[s.id]).length; }
function asgMiss(a){ return asgTargets(a).filter(s=>!a.submitted[s.id]); }
A.addAsg = () => { const t = $("#asgTitle").value.trim(); if(!t){ $("#asgTitle").focus(); return; } const a = {id:uid(), title:t, due:$("#asgDue").value||today(), submitted:{}, exempt:{}}; S.assignments.push(a); ui.submitSel = a.id; ui.exMode = false; commit(); };
EN.addAsg = () => A.addAsg();
A.selAsg = el => { ui.submitSel = el.dataset.id; ui.exMode = false; render(); };
A.exMode = () => { ui.exMode = !ui.exMode; render(); };
function setEx(a, sid, on){ a.exempt ||= {}; if(on){ a.exempt[sid] = true; delete a.submitted[sid]; } else delete a.exempt[sid]; }
A.asgEx = el => { const a = S.assignments.find(x=>x.id===ui.submitSel); setEx(a, el.dataset.s, !isEx(a, el.dataset.s)); commit(); };
A.asgToggle = el => { const a = S.assignments.find(x=>x.id===ui.submitSel); if(isEx(a, el.dataset.s)) return; if(a.submitted[el.dataset.s]) delete a.submitted[el.dataset.s]; else a.submitted[el.dataset.s] = true; commit(); };

  const overview = `<div class="card"><div class="spread"><h2>미제출 한눈에 보기 <span class="small muted">${missRows.length}명</span></h2><div class="row"><span class="small muted">과제 이름을 누르면 바로 제출로 바뀌어요</span>${missRows.length?`<button class="btn sm" data-act="copyMissAll">전체 명단 복사</button>`:""}</div></div>

  return header("제출 체크", "위에서 학생별 미제출 과제를 한눈에 보고, 아래에서 한 학생씩 자세히 체크해요. 해당 없는 과제는 '제외'를 누르세요.", modeSeg) + overview + `
  <div class="split">
    <div class="card" style="padding:12px"><div class="list">
      ${st.map(x=>{ const m = missOf(x.id).length; return `<div class="li ${x.id===s.id?"on":""}" data-act="submitStu" data-id="${x.id}"><span><span class="muted small num">${x.no}</span> ${esc(x.name)}</span>${m?`<span class="pill ${m>=3?"bad":"warn"} num">${m}</span>`:`<span class="pill ok">완료</span>`}</div>`; }).join("")}
    </div></div>
    <div class="card">${list.length ? `<div class="spread"><div><h2><span class="muted num" style="font-size:14px">${s.no}번</span> ${esc(s.name)}</h2><div class="small muted">해당 과제 ${mineList.length}개 중 제출 ${done} · 미제출 ${mine.length}${exList.length?` · 제외 ${exList.length}`:""}</div></div>
      <div class="row"><button class="btn sm" data-act="stuAll" data-v="1">모두 제출</button><button class="btn sm" data-act="stuAll" data-v="0">모두 해제</button><button class="btn sm" data-act="stuNext">다음 학생 →</button></div></div>
      <div class="bar ${mine.length?"":"ok"}" style="margin-bottom:14px"><i style="width:${mineList.length?done/mineList.length*100:100}%"></i></div>
      <div class="list">${list.map(a=>{ const ex = isEx(a,s.id), on = !ex && !!a.submitted[s.id], late = !ex && !on && a.due < t;

      : `<div class="empty">아직 과제가 없어요. '과제별'에서 과제를 추가해 주세요.</div>`}</div>
  </div>`;
}

A.copyMiss = async () => { try{ await navigator.clipboard.writeText($("#missTxt").textContent); toast("미제출 명단을 복사했어요"); }catch(e){ toast("복사가 막혀 있어요. 명단을 직접 선택해 복사해 주세요"); } };

/* ───────── 예산 ───────── */
VIEWS.budget = () => {

      <div class="small muted num">한도 합계 ${b.cats.reduce((s,c)=>s+Number(c.pct),0)}% ${b.cats.reduce((s,c)=>s+Number(c.pct),0)!==100?"· 100%가 아니에요":""}</div>
      <div class="row"><input type="text" id="catName" placeholder="새 항목" style="flex:1"><input type="number" id="catPct" placeholder="%" style="width:70px" min="0" max="100"><button class="btn sm" data-act="addCat">추가</button></div></div></div>
    <div class="card"><div class="spread"><h2>${esc(b.name)} 지출 내역</h2><button class="btn sm" data-act="budExport">엑셀로 내보내기</button></div>

      ${b.expenses.slice().sort((x,y)=>y.date.localeCompare(x.date)).map(e=>`<tr><td class="num">${e.date.replace(/-/g,". ")}</td><td><span class="pill">${esc(e.cat)}</span></td><td>${esc(e.purpose)}${e.note?` <span class="small muted">${esc(e.note)}</span>`:""}</td><td class="r num">${won(e.amount)}</td><td class="r"><button class="x" data-act="delEx" data-id="${e.id}" aria-label="삭제">×</button></td></tr>`).join("") || `<tr><td colspan="5" class="empty">지출 내역이 없어요</td></tr>`}

/* ───────── 자리 배치 ───────── */
function seatFix(){ const st = S.seats, n = st.rows*st.cols; st.map = (st.map||[]).slice(0,n); while(st.map.length<n) st.map.push(null);
  const ids = new Set(S.students.map(s=>s.id)); st.map = st.map.map(x => ids.has(x) ? x : null); st.locked = (st.locked||[]).filter(i=>i<n);
  st.gfix = Object.fromEntries(Object.entries(st.gfix||{}).filter(([i,g])=>Number(i)<n && (g==="남"||g==="여"))); }
VIEWS.seats = () => {
  if(!S.students.length) return header("자리 배치") + noStudents();

  const st = S.seats, placed = new Set(st.map.filter(Boolean)), unplaced = sorted().filter(s=>!placed.has(s.id));

  const gm = Object.values(st.gfix).filter(g=>g==="남").length, gf = Object.values(st.gfix).filter(g=>g==="여").length;
  const nb = S.students.filter(s=>s.gender!=="여").length, ng = S.students.length - nb;
  const seatHtml = i => { const id = st.map[i], s = id && stu(id), c = i % st.cols, g = st.gfix[i];
    const gap = st.pair && (ui.seatView==="student" ? (st.cols-1-c) : c) % 2 === 1 && c !== (ui.seatView==="student"?0:st.cols-1);
    const mismatch = s && g && (s.gender==="여" ? "여" : "남") !== g;
    return `<button class="seat ${s?(s.gender==="여"?"f":"m"):"empty"} ${g==="남"?"gfix-m":g==="여"?"gfix-f":""} ${mismatch?"gmis":""} ${ui.seatPick===i?"pick":""} ${st.locked.includes(i)?"lock":""} ${gap?"gap":""}" data-act="seatClick" data-i="${i}" ${g?`title="${g}학생 자리${mismatch?" (지금 다른 성별이 앉아 있어요)":""}"`:""}>${g?`<span class="gtag">${g}</span>`:""}${s?`<span class="no num">${s.no}</span><span>${esc(s.name)}</span>`:"빈자리"}</button>`; };

  return header("자리 배치", hint,
    `<div class="seg"><button class="${ui.seatView==="teacher"?"on":""}" data-act="seatView" data-v="teacher">교사 자리에서</button><button class="${ui.seatView==="student"?"on":""}" data-act="seatView" data-v="student">학생 자리에서</button></div>`) + `
  <div class="card"><div class="spread" style="margin-bottom:12px">
    <div class="row"><label class="f" style="flex-direction:row;align-items:center;gap:6px">줄<input type="number" min="1" max="10" value="${st.rows}" data-ch="seatRows" style="width:60px"></label>

    <div class="row"><button class="btn ${mode==="lock"?"pri":""}" data-act="seatMode" data-v="lock">${mode==="lock"?"고정 완료":"학생 자리 고정"}</button>

      <button class="btn" data-act="seatShuffle" data-g="0">무작위 섞기</button><button class="btn pri" data-act="seatShuffle" data-g="1">남녀 짝으로 섞기</button><button class="btn" data-act="seatExport">엑셀로</button></div></div>
    ${mode==="gender" ? `<div class="banner" style="background:var(--bg);border-color:var(--line);margin-bottom:12px"><div class="small">남자리 <b class="num" style="color:var(--accent)">${gm}</b> / 남학생 ${nb}명 · 여자리 <b class="num" style="color:var(--violet)">${gf}</b> / 여학생 ${ng}명${gm>nb||gf>ng?` <span style="color:var(--warn)">· 정한 자리가 학생보다 많아요</span>`:""}</div>
      <div class="row"><button class="btn sm" data-act="gPreset" data-v="pair">짝마다 남·여</button><button class="btn sm" data-act="gPreset" data-v="check">체크무늬</button><button class="btn sm" data-act="gPreset" data-v="row">줄마다 번갈아</button><button class="btn sm danger" data-act="gPreset" data-v="clear">모두 지우기</button></div></div>` : ""}

function reflowSeats(){ const ids = S.seats.map.filter(Boolean); S.seats.map = []; S.seats.locked = []; S.seats.gfix = {}; seatFix(); ids.forEach((id,k)=>{ if(k<S.seats.map.length) S.seats.map[k]=id; }); commit(); }
A.seatShuffle = el => { seatFix(); const st = S.seats, n = st.rows*st.cols;
  const lockedIds = new Set(st.locked.map(i=>st.map[i]).filter(Boolean));
  const free = []; for(let i=0;i<n;i++) if(!st.locked.includes(i)) free.push(i);
  const pool = shuffle(S.students.filter(s=>!lockedIds.has(s.id)));
  if(pool.length > free.length) toast(`자리보다 학생이 ${pool.length-free.length}명 많아요`);
  free.forEach(i=>st.map[i]=null);
  const boys = pool.filter(s=>s.gender!=="여"), girls = pool.filter(s=>s.gender==="여");
  // 1) 자리마다 앉힐 성별 정하기: 성별 지정 자리는 그대로, 남녀 짝 모드면 짝의 반대 성별
  const need = {}; free.forEach(i=>{ if(st.gfix[i]) need[i] = st.gfix[i]; });
  if(el.dataset.g==="1"){
    const opp = g => g==="남" ? "여" : "남";
    for(let r=0;r<st.rows;r++) for(let c=0;c+1<st.cols;c+=2){ const a=r*st.cols+c, b=a+1; if(!free.includes(a)||!free.includes(b)) continue;
      if(need[a] && !need[b]) need[b] = opp(need[a]); else if(need[b] && !need[a]) need[a] = opp(need[b]);
      else if(!need[a] && !need[b]){ const g = Math.random()<.5 ? "남" : "여"; need[a] = g; need[b] = opp(g); } }
  }
  // 2) 성별 지정 자리(st.gfix) 먼저, 그다음 짝 맞춤 자리에 채우기
  const unmet = [];
  const fillNeed = cells => shuffle(cells).forEach(i => { const list = need[i]==="남" ? boys : girls; if(list.length) st.map[i] = list.pop().id; else unmet.push(i); });
  fillNeed(free.filter(i=>st.gfix[i])); fillNeed(free.filter(i=>need[i] && !st.gfix[i]));
  // 3) 남은 자리에 남은 학생
  const rest = shuffle(boys.concat(girls));
  shuffle(free.filter(i=>!need[i])).concat(unmet).forEach(i => { if(st.map[i]===null && rest.length) st.map[i] = rest.pop().id; });
  const mis = free.filter(i=>st.gfix[i] && st.map[i] && ((stu(st.map[i]).gender==="여"?"여":"남") !== st.gfix[i])).length;
  if(mis) toast(`성별을 정한 자리 ${mis}곳은 학생 수가 맞지 않아 다른 성별이 앉았어요`);
  ui.seatPick = null; commit(); };

  if(ui.roleTab==="list") return top + `<div class="card"><div class="scroll"><table class="t"><thead><tr><th>역할</th><th>하는 일</th><th class="r">맡은 학생</th><th></th></tr></thead><tbody>
    ${R.list.map(r=>`<tr><td><input type="text" value="${esc(r.name)}" data-ch="roleName" data-id="${r.id}"></td><td><input type="text" value="${esc(r.desc)}" placeholder="예: 쉬는 시간마다 칠판 지우기" data-ch="roleDesc" data-id="${r.id}" style="width:100%"></td><td class="r small muted">${sorted().filter(s=>R.assign[s.id]===r.id).map(s=>esc(s.name)).join(", ")||"-"}</td><td class="r"><button class="x" data-act="delRole" data-id="${r.id}" aria-label="삭제">×</button></td></tr>`).join("") || `<tr><td colspan="4" class="empty">역할을 추가해 주세요</td></tr>`}
    </tbody></table></div>
    <div class="row" style="margin-top:12px"><input type="text" id="roleNew" placeholder="새 역할 이름" data-enter="addRole" style="flex:1"><button class="btn pri" data-act="addRole">역할 추가</button></div>
    <div class="small muted" style="margin-top:8px">${R.list.length<S.students.length?`역할이 학생보다 ${S.students.length-R.list.length}개 적어요. 무작위 배정하면 역할 없는 학생이 생겨요.`:"역할 수가 충분해요."}</div></div>`;
  if(ui.roleTab==="history") return top + (R.history.length ? R.history.slice().reverse().map((h,ri)=>{ const i = R.history.length-1-ri; return `<div class="card"><div class="spread"><h2>${esc(h.period||"이름 없는 기간")}</h2><div class="row"><span class="small muted">${new Date(h.at).toLocaleDateString("ko-KR")} 저장</span><button class="btn sm" data-act="roleHistLoad" data-i="${i}">이 배정 다시 쓰기</button><button class="x" data-act="roleHistDel" data-i="${i}" aria-label="삭제">×</button></div></div>
    <div class="scroll"><table class="t"><tbody>${sorted().filter(s=>h.assign[s.id]).map(s=>`<tr><td class="num" style="width:50px">${s.no}</td><td style="width:120px">${esc(s.name)}</td><td>${esc(h.names[h.assign[s.id]]||"")}</td></tr>`).join("")}</tbody></table></div></div>`; }).join("") : `<div class="card empty">저장한 기록이 없어요. 배정 화면에서 '이번 배정 기록하기'를 누르면 남아요.</div>`);
  const cnt = {}; Object.values(R.assign).forEach(id=>{ if(roleName(id)) cnt[id] = (cnt[id]||0)+1; });
  const unassignedRoles = R.list.filter(r=>!cnt[r.id]);
  return top + `
  <div class="card"><div class="spread">
    <div class="row"><label class="f" style="flex-direction:row;align-items:center;gap:6px">기간<input type="text" value="${esc(R.period)}" placeholder="예: 11월 2주, 2학기 1차" data-ch="rolePeriod" style="width:170px"></label></div>
    <div class="row"><button class="btn" data-act="roleRandom">무작위 배정</button><button class="btn" data-act="roleRotate" title="모든 학생이 앞 번호 학생의 역할을 받아요">한 칸씩 돌리기</button><button class="btn" data-act="roleSave">이번 배정 기록하기</button><button class="btn" data-act="roleExport">엑셀로</button></div></div>
    ${unassignedRoles.length && R.list.length ? `<div class="small muted">아무도 맡지 않은 역할: ${unassignedRoles.map(r=>esc(r.name)).join(", ")}</div>` : ""}
    ${!R.list.length ? `<div class="banner" style="margin-top:10px">아직 역할이 없어요. <button class="btn sm" data-act="roleTab" data-v="list">역할 목록 만들기</button></div>` : ""}
  </div>
  <div class="card"><div class="spread"><h2>${md(t)} 역할 확인</h2><div class="row"><button class="btn sm" data-act="roleCheckAll" data-v="1">모두 완료</button><button class="btn sm" data-act="roleCheckAll" data-v="0">모두 해제</button></div></div>
    <div class="bar ok" style="margin-bottom:12px"><i style="width:${withRole.length?done/withRole.length*100:0}%"></i></div>
    <div class="scroll"><table class="t"><thead><tr><th>번호</th><th>이름</th><th>역할</th><th>하는 일</th><th class="c">오늘 했어요</th></tr></thead><tbody>
    ${sorted().map(s=>{ const rid = R.assign[s.id], r = R.list.find(x=>x.id===rid);
      return `<tr><td class="num">${s.no}</td><td>${esc(s.name)}</td><td><select data-ch="roleAssign" data-s="${s.id}" aria-label="${esc(s.name)} 역할"><option value="">없음</option>${R.list.map(x=>`<option value="${x.id}" ${x.id===rid?"selected":""}>${esc(x.name)}${cnt[x.id]>1&&x.id===rid?` (${cnt[x.id]}명)`:""}</option>`).join("")}</select></td><td class="small muted">${r?esc(r.desc):""}</td><td class="c">${r?`<input type="checkbox" ${chk[s.id]?"checked":""} data-ch="roleCheck" data-s="${s.id}" style="width:18px;height:18px;accent-color:var(--ok)" aria-label="${esc(s.name)} 오늘 완료">`:""}</td></tr>`; }).join("")}
    </tbody></table></div></div>`;
}
A.roleTab = el => { ui.roleTab = el.dataset.v; render(); };
A.addRole = () => { const n = $("#roleNew").value.trim(); if(!n){ $("#roleNew").focus(); return; } rolesOf().list.push({id:uid(), name:n, desc:""}); commit(); $("#roleNew")?.focus(); };
EN.addRole = () => A.addRole();
CH.roleName = el => { const r = rolesOf().list.find(x=>x.id===el.dataset.id); r.name = el.value.trim()||r.name; commit(); };
CH.roleDesc = el => { rolesOf().list.find(x=>x.id===el.dataset.id).desc = el.value; persist(); };
A.delRole = async el => { if(await ask("이 역할을 지울까요? 맡고 있던 학생은 '없음'이 돼요.","지우기",true)){ const R = rolesOf(); R.list = R.list.filter(r=>r.id!==el.dataset.id); Object.keys(R.assign).forEach(s=>{ if(R.assign[s]===el.dataset.id) delete R.assign[s]; }); commit(); } };
CH.rolePeriod = el => { rolesOf().period = el.value.trim(); commit(); };
CH.roleAssign = el => { const R = rolesOf(); el.value ? R.assign[el.dataset.s] = el.value : delete R.assign[el.dataset.s]; commit(); };
CH.roleCheck = el => { const R = rolesOf(), c = R.checks[today()] ||= {}; el.checked ? c[el.dataset.s] = true : delete c[el.dataset.s]; commit(); };
A.roleCheckAll = el => { const R = rolesOf(); R.checks[today()] = el.dataset.v==="1" ? Object.fromEntries(S.students.filter(s=>R.list.some(r=>r.id===R.assign[s.id])).map(s=>[s.id,true])) : {}; commit(); };
A.roleRandom = async () => { const R = rolesOf(); if(!R.list.length){ toast("먼저 역할을 만들어 주세요"); return; }
  if(Object.keys(R.assign).length && !(await ask("지금 배정을 지우고 무작위로 다시 정할까요?","다시 정하기"))) return;
  const roles = shuffle(R.list), st = shuffle(S.students); R.assign = {};
  st.forEach((s,i)=>{ if(roles[i]) R.assign[s.id] = roles[i].id; });
  commit(); if(roles.length < st.length) toast(`역할이 부족해서 ${st.length-roles.length}명은 역할이 없어요`); };
A.roleRotate = () => { const R = rolesOf(), st = sorted(); if(!st.length) return;
  const cur = st.map(s=>R.assign[s.id]); R.assign = {};
  st.forEach((s,i)=>{ const v = cur[(i-1+st.length)%st.length]; if(v) R.assign[s.id] = v; });
  commit(); toast("모든 학생이 앞 번호 학생의 역할을 받았어요"); };
A.roleSave = () => { const R = rolesOf(); if(!Object.keys(R.assign).length){ toast("배정된 역할이 없어요"); return; }
  R.history.push({period:R.period || md(today()), at:Date.now(), assign:{...R.assign}, names:Object.fromEntries(R.list.map(r=>[r.id,r.name]))}); commit(); toast("기록했어요"); };
A.roleHistLoad = async el => { const R = rolesOf(), h = R.history[Number(el.dataset.i)]; if(await ask("이 기록의 배정으로 지금 배정을 바꿀까요?","바꾸기")){ R.assign = Object.fromEntries(Object.entries(h.assign).filter(([,rid])=>R.list.some(r=>r.id===rid))); ui.roleTab = "assign"; commit(); } };
A.roleHistDel = async el => { if(await ask("이 기록을 삭제할까요?","삭제",true)){ rolesOf().history.splice(Number(el.dataset.i),1); commit(); } };
A.roleExport = () => { const R = rolesOf(); const name = id => R.list.find(r=>r.id===id)?.name || "";
  exportSheets(`${clsName()}_일인일역${R.period?"_"+R.period:""}`, [["일인일역", [["번호","이름","역할","하는 일"], ...sorted().map(s=>[s.no, s.name, name(R.assign[s.id]), R.list.find(r=>r.id===R.assign[s.id])?.desc||""])]]]); };

VIEWS.jobs = () => {

  const totalCap = J.list.reduce((s,j)=>s+Number(j.cap),0);

    <div class="scroll"><table class="t"><thead><tr><th>직업</th><th class="r">정원</th><th>하는 일</th><th></th></tr></thead><tbody>
    ${J.list.map(j=>`<tr><td><input type="text" value="${esc(j.name)}" data-ch="jobName" data-id="${j.id}"></td><td class="r"><input type="number" min="1" max="10" value="${j.cap}" class="scoreIn" data-ch="jobCap" data-id="${j.id}"></td><td><input type="text" value="${esc(j.desc)}" placeholder="예: 쉬는 시간마다 칠판 지우기" data-ch="jobDesc" data-id="${j.id}" style="width:100%"></td><td class="r"><button class="x" data-act="delJob" data-id="${j.id}" aria-label="삭제">×</button></td></tr>`).join("")}
    </tbody></table></div>
    <div class="row" style="margin-top:12px"><input type="text" id="jobNew" placeholder="새 직업 이름" data-enter="addJob" style="flex:1"><input type="number" id="jobNewCap" value="1" min="1" class="scoreIn"><button class="btn pri" data-act="addJob">직업 추가</button></div></div>`;
  if(ui.jobTab==="history") return header("직업놀이", "분기마다 확정한 직업 배정 기록", tabs) + (J.history.length ? J.history.slice().reverse().map((h,ri)=>`<div class="card"><div class="spread"><h2>${esc(h.quarter)}</h2><div class="row"><span class="small muted">${new Date(h.at).toLocaleDateString("ko-KR")} 확정</span><button class="btn sm" data-act="jobHistExport" data-i="${J.history.length-1-ri}">엑셀로</button><button class="x" data-act="delHist" data-i="${J.history.length-1-ri}" aria-label="삭제">×</button></div></div>
      <div class="scroll"><table class="t"><thead><tr><th>직업</th><th>학생</th></tr></thead><tbody>${Object.entries(h.assign).filter(([,a])=>a.length).map(([jid,a])=>`<tr><td>${esc(h.names?.[jid] || S.jobs.list.find(j=>j.id===jid)?.name || "(삭제된 직업)")}</td><td>${a.map(sname).map(esc).join(", ")}</td></tr>`).join("")}</tbody></table></div></div>`).join("") : `<div class="card empty">아직 확정한 분기가 없어요</div>`);

  /* 직업 뽑기 진행 */
  const d = J.draft;
  if(!d) return header("직업놀이", `${esc(clsName())} 분기별 직업 뽑기`, tabs) + `
    <div class="card" style="display:flex;flex-direction:column;gap:14px;max-width:640px">
      <h2>새 분기 직업 뽑기</h2>
      <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>모든 학생이 1지망을 꼭 지원해요.</li><li>지원자가 정원보다 많으면 가위바위보로 정해요.</li><li>떨어진 학생은 1지망 배정이 끝난 뒤 남은 직업 중 하나를 골라요.</li><li>2지망부터는 희망자만 같은 방식으로 지원해요.</li></ol>
      <label class="f">분기 이름<input type="text" id="jobQuarter" value="${esc(J.quarter || `${new Date().getFullYear()}년 ${Math.floor(new Date().getMonth()/3)+1}분기`)}"></label>
      <div class="small muted">직업 ${J.list.length}개 · 자리 ${totalCap}개 · 학생 ${S.students.length}명 ${totalCap<S.students.length?`<span style="color:var(--bad)">· 자리가 부족해요</span>`:""}</div>
      <div class="row"><button class="btn pri" data-act="jobStart" ${J.list.length?"":"disabled"}>1지망 받기 시작</button><button class="btn" data-act="jobTab" data-v="list">직업 목록 고치기</button></div>
    </div>`;

  const r = d.round, first = r===1;
  const stepNames = [["apply",`${r}지망 지원`],["resolve","가위바위보"],["pick","남은 직업 고르기"]];
  const stepIdx = stepNames.findIndex(s=>s[0]===d.step);
  const stepsHtml = `<div class="steps">${stepNames.map(([k,l],i)=>`<span class="step ${i===stepIdx?"on":i<stepIdx?"done":""}">${i+1}. ${l}</span>`).join("")}</div>`;
  const holding = id => S.jobs.list.filter(j=>(d.assign[j.id]||[]).includes(id)).map(j=>j.name);
  const top = header("직업놀이", `${esc(J.quarter)} · ${r}지망 라운드`, tabs + `<button class="btn ghost danger" data-act="jobCancel">뽑기 취소</button>`) + `<div class="card" style="display:flex;flex-direction:column;gap:12px">${stepsHtml}`;

  if(d.step==="apply"){
    const applied = Object.keys(d.apply).length;
    const cnt = jid => Object.values(d.apply).filter(x=>x===jid).length;
    return top + `<div class="spread"><div class="small muted">${first ? "모든 학생이 1지망을 골라야 다음 단계로 갈 수 있어요." : "이번 라운드에 지원하는 학생만 골라 주세요. 지원 안 하는 학생은 비워 두면 돼요."}</div><span class="pill ${first&&applied<S.students.length?"warn":"ok"}">지원 ${applied}/${S.students.length}</span></div>
      <div class="jobs">${S.jobs.list.map(j=>{ const rem = remaining(d,j.id), c = cnt(j.id); return `<div class="job ${c>rem?"over":""} ${rem<=0?"full":""}"><div class="spread"><b>${esc(j.name)}</b><span class="small num ${c>rem?"":"muted"}" style="${c>rem?"color:var(--warn);font-weight:600":""}">지원 ${c} / 남은 자리 ${rem}</span></div><div class="names">${Object.entries(d.apply).filter(([,x])=>x===j.id).map(([sid])=>`<span class="nm-chip static">${esc(sname(sid))}</span>`).join("")}</div></div>`; }).join("")}</div>

      ${sorted().map(s=>`<tr><td class="num">${s.no}</td><td>${esc(s.name)}</td>${first?"":`<td class="small muted">${holding(s.id).map(esc).join(", ")||"-"}</td>`}<td><select data-ch="jobApply" data-s="${s.id}" aria-label="${esc(s.name)} ${r}지망"><option value="">${first?"선택하세요":"지원 안 함"}</option>${S.jobs.list.filter(j=>remaining(d,j.id)>0 && !(d.assign[j.id]||[]).includes(s.id)).map(j=>`<option value="${j.id}" ${d.apply[s.id]===j.id?"selected":""}>${esc(j.name)}</option>`).join("")}</select></td></tr>`).join("")}
      </tbody></table></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" data-act="jobToResolve" ${first&&applied<S.students.length?"disabled":""}>지원 마감하고 결과 보기</button></div></div>`;
  }
  if(d.step==="resolve"){
    const over = S.jobs.list.filter(j=>Object.values(d.apply).filter(x=>x===j.id).length > remaining(d,j.id));
    const ok = S.jobs.list.filter(j=>{ const c = Object.values(d.apply).filter(x=>x===j.id).length; return c && c<=remaining(d,j.id); });
    const allSet = over.every(j=>(d.winners[j.id]||[]).length===remaining(d,j.id));

        return `<div class="job over"><div class="spread"><b>${esc(j.name)}</b><span class="pill ${w.length===rem?"ok":"warn"}">이긴 학생 ${w.length}/${rem}</span></div><div class="names">${ap.map(sid=>`<button class="nm-chip ${w.includes(sid)?"win":""}" data-act="jobWin" data-j="${j.id}" data-s="${sid}" aria-pressed="${w.includes(sid)}">${esc(sname(sid))}</button>`).join("")}</div><button class="btn sm ghost" data-act="jobRps" data-j="${j.id}">컴퓨터가 대신 정하기</button></div>`; }).join("")}</div>` : `<div class="banner" style="background:var(--ok-soft)">정원을 넘은 직업이 없어요. 모두 1지망대로 배정돼요.</div>`}
      ${ok.length ? `<div><h3 style="margin-bottom:6px">바로 배정되는 직업</h3><div class="jobs">${ok.map(j=>`<div class="job"><b>${esc(j.name)}</b><div class="names">${Object.entries(d.apply).filter(([,x])=>x===j.id).map(([sid])=>`<span class="nm-chip static">${esc(sname(sid))}</span>`).join("")}</div></div>`).join("")}</div></div>` : ""}
      <div class="row" style="justify-content:space-between"><button class="btn" data-act="jobBack" data-to="apply">지원 다시 받기</button><button class="btn pri" data-act="jobToPick" ${allSet?"":"disabled"}>배정하고 다음으로</button></div></div>`;
  }
  if(d.step==="pick"){
    const losers = Object.keys(d.picks);
    const opts = sid => S.jobs.list.filter(j=>remaining(d,j.id) - Object.entries(d.picks).filter(([o,x])=>x===j.id && o!==sid).length > 0 && !(d.assign[j.id]||[]).includes(sid));

      <div class="scroll"><table class="t"><thead><tr><th>번호</th><th>이름</th><th>지원했던 직업</th><th>남은 직업 중 선택</th></tr></thead><tbody>

const GOOGLE_CLIENT_ID = String(window.CLASSBOOK_GOOGLE_CLIENT_ID || "").trim();

const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
let gTok = "", gTokExp = 0, gClient = null, gisReady = false;
function gisLoad(){
  if(!GMODE || gisReady) return;
  const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
  s.onload = () => { try{ gClient = google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID, scope:DRIVE_SCOPE, callback:()=>{}}); gisReady = true; }catch(e){} };

}
let gisFailed = false;
const gTokenOk = () => gTok && Date.now() < gTokExp;
/* 반드시 버튼 클릭 안에서 바로 불러야 팝업이 막히지 않는다 */
function gLogin(){
  return new Promise((res, rej) => {
    if(!gisReady || !gClient) return rej({code: gisFailed ? "gis_blocked" : "gis_loading"});
    gClient.callback = r => { if(r && r.error) return rej({code:"auth_denied", message:r.error}); gTok = r.access_token; gTokExp = Date.now() + (Number(r.expires_in||3600) - 120)*1000; SY.gGranted = true; saveSY(); res(); };
    gClient.error_callback = e => rej({code:"auth_popup", message:e && e.type});
    try{ gClient.requestAccessToken({prompt: SY.gGranted ? "" : "consent"}); }catch(e){ rej({code:"auth_popup"}); }
  });
}
async function gfetch(url, opt={}){
  if(!gTokenOk()) throw {code:"needs_login"};
  let r;
  try{ r = await fetch(url, Object.assign({}, opt, {headers:Object.assign({Authorization:"Bearer "+gTok}, opt.headers||{})})); }
  catch(e){ throw {code:"server_unavailable", message:"인터넷 연결을 확인해 주세요"}; }
  if(r.status===401){ gTok = ""; throw {code:"needs_login"}; }
  if(r.status===403 || r.status===429){ throw {code: r.status===429 ? "server_unavailable" : "forbidden", message:(await r.text()).slice(0,200)}; }
  if(r.status>=500) throw {code:"server_unavailable"};
  if(!r.ok) throw {code:"http_"+r.status, message:(await r.text()).slice(0,200)};
  return r;
}
const GAPI = "https://www.googleapis.com/drive/v3/files";
const qs = o => Object.entries(o).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join("&");
const drv = GMODE ? {
  async findFolder(name){ const r = await (await gfetch(`${GAPI}?${qs({q:`name = '${name}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`, fields:"files(id,name)", spaces:"drive"})}`)).json(); return (r.files||[])[0]?.id || ""; },
  async createFolder(name){ const r = await (await gfetch(GAPI+"?fields=id", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name, mimeType:"application/vnd.google-apps.folder"})})).json(); return r.id; },
  async list(fid){ const r = await (await gfetch(`${GAPI}?${qs({q:`'${fid}' in parents and trashed = false`, orderBy:"modifiedTime desc", pageSize:30, fields:"files(id,name)", spaces:"drive"})}`)).json(); return (r.files||[]).map(f=>({id:f.id, title:f.name})); },
  async upload(fid, title, text){ const b = "cb" + Date.now();
    const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:title, parents:[fid], mimeType:"application/json"})}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${text}\r\n--${b}--`;
    await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {method:"POST", headers:{"Content-Type":`multipart/related; boundary=${b}`}, body}); },
  async download(id){ return await (await gfetch(`${GAPI}/${id}?alt=media`)).text(); },
  async trash(id){ await gfetch(`${GAPI}/${id}?fields=id`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({trashed:true})}); },
  limit: 4500000
} : {
  async findFolder(name){ const r = await gd("search_files", {query:`title = '${name}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`, pageSize:5, excludeContentSnippets:true}); return ((r && r.files) || [])[0]?.id || ""; },
  async createFolder(name){ return (await gd("create_file", {title:name, contentMimeType:"application/vnd.google-apps.folder"})).id; },
  async list(fid){ const r = await gd("search_files", {query:`parentId = '${fid}' and title contains '학급일지_' and trashed = false`, orderBy:"modifiedTime desc", pageSize:30, excludeContentSnippets:true}); return ((r && r.files) || []).map(f=>({id:f.id, title:f.title})); },
  async upload(fid, title, text){ await gd("create_file", {title, parentId:fid, textContent:text, contentMimeType:"application/json", disableConversionToGoogleType:true}); },
  async download(id){ const r = await gd("download_file_content", {fileId:id}); return b64utf8(r.content); },
  async trash(id){ await gd("trash_file", {fileId:id}); },
  limit: 950000
};
/* 동기화를 사용자가 누른 버튼에서 시작할 때: 구글 모드면 먼저 로그인 */

function renderSoon(){ const a = document.activeElement; if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ a.addEventListener("blur", () => setTimeout(render, 0), {once:true}); } else render(); }
async function ensureFolder(){
  if(SY.folderId) return SY.folderId;
  SY.folderId = (await drv.findFolder(GD_FOLDER)) || (await drv.createFolder(GD_FOLDER));
  saveSY(); return SY.folderId;
}
async function listRemote(){
  const fid = await ensureFolder();
  return (await drv.list(fid)).map(f => ({id:f.id, rev:Number((String(f.title).match(/학급일지_(\d+)\.json/)||[])[1]||0)})).filter(f=>f.rev).sort((a,b)=>b.rev-a.rev);
}
async function readRemote(f){
  const j = JSON.parse(await drv.download(f.id));
  if(!j || !j.data || !Array.isArray(j.data.students)) throw {code:"bad_file", message:"학급일지 백업 파일이 아니에요"};
  return j;
}
function applyRemote(j){
  syncApplying = true; S = Object.assign(blank(), j.data); persist(); syncApplying = false;

}
async function uploadNow(){

async function cleanupRemote(){ try{ const l = await listRemote(); for(const f of l.slice(GD_KEEP)) await drv.trash(f.id); }catch(e){} }
async function syncCycle(reason){

      else { syncConflict = top; Object.assign(SY, {state:"conflict", msg:"다른 기기에서 저장한 기록이 있어요. 어느 쪽을 쓸지 골라 주세요."}); saveSY(); render(); }

function agoText(ts){ if(!ts) return "아직 없음"; const m = Math.floor((Date.now()-ts)/60000); return m<1 ? "방금" : m<60 ? `${m}분 전` : new Date(ts).toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"numeric", minute:"2-digit"}); }
function syncLine(){
